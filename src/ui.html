function normalizeDriveToken(token) {
  token = (token || '').trim();
  if ((token[0] === '"' && token[token.length - 1] === '"') || (token[0] === "'" && token[token.length - 1] === "'")) {
    token = token.slice(1, -1).trim();
  }
  if (token.toLowerCase().startsWith('bearer ')) token = token.slice(7).trim();
  return token;
}

async function saveCloudSettings() {
  const watch = ($('setWatch').value || '').split(',').map(x => x.trim()).filter(Boolean);
  const driveAuth = $('setDriveAuth') ? $('setDriveAuth').value : 'oauth_refresh';
  localStorage.setItem('gdrive_auth_mode', driveAuth);
  const accessToken = normalizeDriveToken($('setDriveAccessToken') ? $('setDriveAccessToken').value : '');
  if (accessToken && accessToken !== '********') localStorage.setItem('gdrive_access_token', accessToken);
  const saText = ($('setDriveServiceAccount') ? $('setDriveServiceAccount').value : '').trim();
  let serviceAccount = {};
  if (driveAuth === 'service_account' && saText) {
    try {
      serviceAccount = JSON.parse(saText);
      localStorage.setItem('gdrive_service_account', JSON.stringify(serviceAccount, null, 2));
    } catch (e) {
      log('Service account JSON is invalid: ' + e.message, 'err');
      return;
    }
  }
  const cfg = {
    enabled: $('setEnabled').checked,
    provider: $('setProvider').value,
    watch_titles: watch,
    ftp: {
      host: $('setFtpHost').value.trim(),
      port: parseInt($('setFtpPort').value || '21', 10),
      user: $('setFtpUser').value.trim(),
      pass: $('setFtpPass').value,
      remote_path: $('setFtpPath').value.trim() || '/',
      use_tls: $('setFtpTls').checked
    },
    backup_targets: {
      local: {
        enabled: $('setTargetLocal').checked,
        path: $('setTargetLocalPath').value.trim() || '/data/shallot/backups'
      },
      usb: {
        enabled: $('setTargetUsb').checked,
        path: $('setTargetUsbPath').value.trim() || '/mnt/usb0/shallot-backups'
      },
      ftp: { enabled: $('setTargetFtp').checked },
      google_drive: { enabled: $('setTargetDrive').checked }
    },
    google_drive: {
      mode: $('setDriveMode').value,
      auth_mode: driveAuth,
      folder_id: $('setDriveFolder').value.trim(),
      client_id: $('setDriveClientId') ? $('setDriveClientId').value.trim() : '',
      client_secret: $('setDriveClientSecret') ? $('setDriveClientSecret').value : '',
      refresh_token: $('setDriveRefreshToken') ? $('setDriveRefreshToken').value.trim() : '',
      access_token: $('setDriveAccessToken') ? $('setDriveAccessToken').value.trim() : '',
      service_account: $('setDriveSaveSa').checked ? serviceAccount : {}
    },
    auto_backup: {
      enabled: $('setAutoEnabled').checked,
      auto_enabled: $('setAutoEnabled').checked,
      poll_seconds: parseInt($('setAutoPoll').value || '5', 10),
      settle_seconds: parseInt($('setAutoSettle').value || '15', 10),
      queue_for_browser_drive: $('setAutoQueueDrive').checked
    }
  };
  try {
    const r = await fetch('/api/settings/cloud', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cfg)
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    log('Cloud settings saved', 'ok');
    renderSettings();
  } catch (e) {
    log('Save settings failed: ' + e.message, 'err');
  }
}

async function testCloudSettings() {
  try {
    const r = await fetch('/api/cloud/status');
    const d = await r.json();
    if (d.config_error) {
      log('Cloud config: ' + d.config_error, 'err');
      return;
    }
    log('Cloud config OK: ' + d.provider + (d.provider === 'google_drive' ? ' / ' + d.drive_mode : ''), 'ok');
    if (d.provider === 'ftp') {
      log('Testing FTP to ' + (d.host || '?') + ':' + (d.port || 21) + ' from PS5...');
      const tr = await fetch('/api/cloud/test_ftp');
      const td = await tr.json();
      if (td.ok) log(td.message || 'FTP test OK', 'ok');
      else log('FTP test failed (' + (td.stage || 'unknown') + '): ' + (td.error || 'unknown error'), 'err');
    }
  } catch (e) {
    log('Cloud status failed: ' + e.message, 'err');
  }
}

async function validateDriveToken(token) {
  token = normalizeDriveToken(token);
  if (!token) throw new Error('Add a Google Drive OAuth access token in Settings first');
  const r = await fetch('https://oauth2.googleapis.com/tokeninfo?access_token=' + encodeURIComponent(token));
  const txt = await r.text();
  if (!r.ok) throw new Error('Google Drive token is invalid or expired. Paste a fresh OAuth access token with Drive scope.');
  let info = {};
  try { info = JSON.parse(txt || '{}'); } catch(e) {}
  const scopes = (info.scope || '').split(/\s+/);
  const okScope = scopes.includes('https://www.googleapis.com/auth/drive')
    || scopes.includes('https://www.googleapis.com/auth/drive.file')
    || scopes.includes('https://www.googleapis.com/auth/drive.appdata');
  if (!okScope) throw new Error('Google Drive token is missing Drive scope. Use drive.file or drive scope.');
  localStorage.setItem('gdrive_access_token', token);
  return info;
}

async function testDriveToken() {
  try {
    const inputToken = $('setDriveAccessToken') ? $('setDriveAccessToken').value : '';
    const token = normalizeDriveToken(inputToken || localStorage.getItem('gdrive_access_token') || '');
    const info = await validateDriveToken(token);
    log('Google Drive access token OK' + (info.expires_in ? ' (expires in ' + info.expires_in + 's)' : ''), 'ok');
  } catch(e) {
    log('Google Drive access token failed: ' + e.message, 'err');
  }
}

function base64UrlString(s) {
  return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function base64UrlBytes(buf) {
  const bytes = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function pemToArrayBuffer(pem) {
  const clean = (pem || '').replace(/-----BEGIN PRIVATE KEY-----/g, '')
    .replace(/-----END PRIVATE KEY-----/g, '').replace(/\s+/g, '');
  const bin = atob(clean);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

function utf8Bytes(s) {
  if (window.TextEncoder) return new TextEncoder().encode(s);
  const enc = unescape(encodeURIComponent(s));
  const out = new Uint8Array(enc.length);
  for (let i = 0; i < enc.length; i++) out[i] = enc.charCodeAt(i);
  return out;
}

function bytesToBigInt(bytes) {
  let hex = '';
  for (let i = 0; i < bytes.length; i++) {
    const h = bytes[i].toString(16);
    hex += h.length === 1 ? '0' + h : h;
  }
  return BigInt('0x' + (hex || '0'));
}

function bigIntToBytes(v, len) {
  let hex = v.toString(16);
  if (hex.length % 2) hex = '0' + hex;
  const raw = new Uint8Array(hex.length / 2);
  for (let i = 0; i < raw.length; i++) raw[i] = parseInt(hex.substr(i * 2, 2), 16);
  if (raw.length === len) return raw;
  const out = new Uint8Array(len);
  out.set(raw.slice(Math.max(0, raw.length - len)), Math.max(0, len - raw.length));
  return out;
}

function modPow(base, exp, mod) {
  let result = 1n;
  base %= mod;
  while (exp > 0n) {
    if (exp & 1n) result = (result * base) % mod;
    exp >>= 1n;
    base = (base * base) % mod;
  }
  return result;
}

function derElement(bytes, off, expectedTag) {
  const tag = bytes[off++];
  if (expectedTag !== undefined && tag !== expectedTag) throw new Error('Unsupported private key format');
  let len = bytes[off++];
  if (len & 0x80) {
    const n = len & 0x7f;
    len = 0;
    for (let i = 0; i < n; i++) len = (len << 8) | bytes[off++];
  }
  return { tag, start: off, end: off + len, next: off + len };
}

function derInteger(bytes, off) {
  const el = derElement(bytes, off, 0x02);
  let b = bytes.slice(el.start, el.end);
  while (b.length > 1 && b[0] === 0) b = b.slice(1);
  return { value: bytesToBigInt(b), next: el.next, byteLength: b.length };
}

function parsePkcs8RsaPrivateKey(pem) {
  if (typeof BigInt === 'undefined') throw new Error('This browser needs WebCrypto or BigInt to sign service-account JWTs');
  const bytes = new Uint8Array(pemToArrayBuffer(pem));
  const root = derElement(bytes, 0, 0x30);
  let off = root.start;
  off = derElement(bytes, off, 0x02).next;      // PrivateKeyInfo version
  off = derElement(bytes, off, 0x30).next;      // AlgorithmIdentifier
  const keyOctets = derElement(bytes, off, 0x04);
  const rsa = bytes.slice(keyOctets.start, keyOctets.end);
  const seq = derElement(rsa, 0, 0x30);
  off = seq.start;
  off = derElement(rsa, off, 0x02).next;        // RSAPrivateKey version
  const n = derInteger(rsa, off); off = n.next;
  off = derElement(rsa, off, 0x02).next;        // publicExponent
  const d = derInteger(rsa, off);
  return { n: n.value, d: d.value, k: n.byteLength };
}

function sha256Bytes(data) {
  const k = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bitLen = data.length * 8;
  const len = (((data.length + 9 + 63) >> 6) << 6);
  const msg = new Uint8Array(len);
  msg.set(data);
  msg[data.length] = 0x80;
  const dv = new DataView(msg.buffer);
  dv.setUint32(len - 4, bitLen >>> 0);
  dv.setUint32(len - 8, Math.floor(bitLen / 0x100000000));
  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
  let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const w = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let i = 0; i < msg.length; i += 64) {
    for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++) {
      const s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
      const s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) >>> 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let t = 0; t < 64; t++) {
      const s1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const temp1 = (h + s1 + ch + k[t] + w[t]) >>> 0;
      const s0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const temp2 = (s0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + temp1) >>> 0;
      d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
    h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
  }
  const out = new Uint8Array(32);
  const od = new DataView(out.buffer);
  [h0,h1,h2,h3,h4,h5,h6,h7].forEach((v, i) => od.setUint32(i * 4, v));
  return out;
}

function rsaSha256SignFallback(input, pem) {
  const key = parsePkcs8RsaPrivateKey(pem);
  const digest = sha256Bytes(utf8Bytes(input));
  const prefix = [0x30,0x31,0x30,0x0d,0x06,0x09,0x60,0x86,0x48,0x01,0x65,0x03,0x04,0x02,0x01,0x05,0x00,0x04,0x20];
  const tLen = prefix.length + digest.length;
  if (key.k < tLen + 11) throw new Error('RSA key is too small');
  const em = new Uint8Array(key.k);
  em[0] = 0; em[1] = 1;
  em.fill(0xff, 2, key.k - tLen - 1);
  em[key.k - tLen - 1] = 0;
  em.set(prefix, key.k - tLen);
  em.set(digest, key.k - digest.length);
  return bigIntToBytes(modPow(bytesToBigInt(em), key.d, key.n), key.k);
}

async function signServiceJwt(input, pem) {
  if (window.crypto && window.crypto.subtle) {
    const key = await window.crypto.subtle.importKey('pkcs8', pemToArrayBuffer(pem),
      { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
    return new Uint8Array(await window.crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, utf8Bytes(input)));
  }
  return rsaSha256SignFallback(input, pem);
}

function loadServiceAccount(cfg) {
  const local = localStorage.getItem('gdrive_service_account');
  if (local) return JSON.parse(local);
  const gd = (cfg && cfg.google_drive) || {};
  const sa = gd.service_account || {};
  if (sa.private_key && sa.private_key !== '********') return sa;
  throw new Error('Paste a Google service account JSON in Settings first');
}

async function serviceAccountAccessToken(cfg) {
  const sa = loadServiceAccount(cfg);
  if (!sa.client_email || !sa.private_key) throw new Error('Service account JSON must include client_email and private_key');
  const tokenUri = sa.token_uri || 'https://oauth2.googleapis.com/token';
  const now = Math.floor(Date.now() / 1000);
  const header = { alg: 'RS256', typ: 'JWT' };
  if (sa.private_key_id) header.kid = sa.private_key_id;
  const payload = {
    iss: sa.client_email,
    scope: 'https://www.googleapis.com/auth/drive',
    aud: tokenUri,
    iat: now,
    exp: now + 3600
  };
  const input = base64UrlString(JSON.stringify(header)) + '.' + base64UrlString(JSON.stringify(payload));
  const sig = await signServiceJwt(input, sa.private_key);
  const assertion = input + '.' + base64UrlBytes(sig);
  const r = await fetch(tokenUri, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'grant_type=' + encodeURIComponent('urn:ietf:params:oauth:grant-type:jwt-bearer') + '&assertion=' + encodeURIComponent(assertion)
  });
  const txt = await r.text();
  if (!r.ok) throw new Error('Service account token failed: HTTP ' + r.status + ' ' + txt);
  const d = JSON.parse(txt || '{}');
  if (!d.access_token) throw new Error('Service account token response did not include access_token');
  return d.access_token;
}

async function tryValidateDriveToken(token) {
  token = normalizeDriveToken(token);
  if (!token || token === '********') return null;
  try {
    await validateDriveToken(token);
    return token;
  } catch (e) {
    return null;
  }
}

function driveAuthMode(cfg) {
  const gd = (cfg && cfg.google_drive) || {};
  let mode = gd.auth_mode || localStorage.getItem('gdrive_auth_mode') || 'oauth_refresh';
  if (mode === 'oauth_token') mode = 'oauth_refresh';
  return mode;
}

function driveOAuthCredentials(cfg) {
  const gd = (cfg && cfg.google_drive) || {};
  return {
    clientId: ($('setDriveClientId') ? $('setDriveClientId').value.trim() : '') || gd.client_id || '',
    clientSecret: ($('setDriveClientSecret') ? $('setDriveClientSecret').value : '') || gd.client_secret || '',
    refreshToken: ($('setDriveRefreshToken') ? $('setDriveRefreshToken').value.trim() : '') || gd.refresh_token || '',
    accessToken: normalizeDriveToken(
      ($('setDriveAccessToken') ? $('setDriveAccessToken').value : '')
      || gd.access_token
      || localStorage.getItem('gdrive_access_token')
      || ''
    )
  };
}

async function oauthRefreshAccessToken(cfg) {
  const creds = driveOAuthCredentials(cfg);
  if (!creds.clientId) throw new Error('OAuth Client ID is required');
  if (!creds.clientSecret || creds.clientSecret === '********') throw new Error('OAuth Client Secret is required');
  if (!creds.refreshToken || creds.refreshToken === '********') throw new Error('OAuth Refresh Token is required');

  const cacheKey = 'gdrive_oauth_cache_' + creds.clientId.slice(-8);
  const cached = sessionStorage.getItem(cacheKey);
  if (cached) {
    try {
      const c = JSON.parse(cached);
      if (c.token && c.expires_at > Date.now() + 60000) return c.token;
    } catch (e) {}
  }

  const live = await tryValidateDriveToken(creds.accessToken);
  if (live) return live;

  const body = new URLSearchParams({
    client_id: creds.clientId,
    client_secret: creds.clientSecret,
    refresh_token: creds.refreshToken,
    grant_type: 'refresh_token'
  });
  const r = await fetch('https://oauth2.googleapis.com/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString()
  });
  const txt = await r.text();
  if (!r.ok) throw new Error('OAuth refresh failed: HTTP ' + r.status + ' ' + txt);
  let d = {};
  try { d = JSON.parse(txt || '{}'); } catch (e) {}
  if (!d.access_token) throw new Error('OAuth refresh response did not include access_token');
  sessionStorage.setItem(cacheKey, JSON.stringify({
    token: d.access_token,
    expires_at: Date.now() + ((d.expires_in || 3600) - 60) * 1000
  }));
  localStorage.setItem('gdrive_access_token', d.access_token);
  return d.access_token;
}

async function driveAccessToken(cfg) {
  const mode = driveAuthMode(cfg);
  if (mode === 'oauth_refresh') return oauthRefreshAccessToken(cfg);
  return serviceAccountAccessToken(cfg);
}

async function testDriveAccess() {
  try {
    const cfg = await loadCloudConfigForAction();
    const token = await driveAccessToken(cfg);
    const folderId = ($('setDriveFolder') ? $('setDriveFolder').value.trim() : ((cfg.google_drive || {}).folder_id || ''));
    if (!folderId) throw new Error('Folder ID is required');
    const r = await fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(folderId) + '?fields=id,name,mimeType,capabilities/canAddChildren&supportsAllDrives=true', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const txt = await r.text();
    if (!r.ok) {
      if (r.status === 404) {
        if (driveAuthMode(cfg) === 'oauth_refresh') {
          throw new Error('Drive folder was not found for this OAuth account. Check the Folder ID and tokens. Google said: ' + txt);
        } else {
          const sa = loadServiceAccount(cfg);
          throw new Error('Drive folder was not found or is not shared with service account '
            + (sa.client_email || '(missing client_email)') + '. Check the Folder ID and share the folder with that email. Google said: ' + txt);
        }
      }
      throw new Error('Drive folder check failed: HTTP ' + r.status + ' ' + txt);
    }
    const d = JSON.parse(txt || '{}');
    if (d.mimeType !== 'application/vnd.google-apps.folder') throw new Error('Drive ID is not a folder: ' + (d.name || d.id));
    if (d.capabilities && d.capabilities.canAddChildren === false) throw new Error('Drive auth can see the folder but cannot upload to it. Give this account Editor access.');
    log('Drive auth can access folder: ' + (d.name || d.id), 'ok');
  } catch(e) {
    log('Drive access test failed: ' + e.message, 'err');
  }
}

async function testServiceAccount() {
  return testDriveAccess();
}

/* ── Decrypt drop ──────────────────────────────────── */
async function decDrop(files) {
  if (bsy || !files.length) return;
  /* Check first byte to detect PS4 (0x01) vs PS5 (0x02) */
  const imgFile = files[0];
  const hdr = new Uint8Array(await imgFile.slice(0, 1).arrayBuffer());
  const isPS4 = (hdr[0] === 0x01);

  let binFile = null;
  if (isPS4) {
    /* Look for .bin in the dropped files */
    for (let i = 1; i < files.length; i++) {
      if (files[i].name.endsWith('.bin')) { binFile = files[i]; break; }
    }
    if (!binFile) {
      log('PS4 save detected — please drop both the save image and its .bin sealed key file together', 'err');
      return;
    }
  }

  bsy = true;
  $('ct').innerHTML = '<div class="drop"><div class="dlbl">' + t('status.uploading_decrypt', 'Uploading for decrypt...') + '</div></div>';
  try {
    /* For PS4, upload .bin key first */
    if (isPS4 && binFile) {
      log('Uploading PS4 sealed key ' + binFile.name + '...');
      const kxhr = await upload('/api/upload_key', binFile);
      if (kxhr.status !== 200) throw new Error('Failed to upload .bin key');
    }
    log('Uploading ' + imgFile.name + ' (' + fmtB(imgFile.size) + ')...');
    const xhr = await upload('/api/decrypt_upload' + (isPS4 ? '?ps4=1' : ''), imgFile, (loaded, total) => {
      const pct = Math.round(loaded * 100 / total);
      showProgress(pct, loaded, total);
    });
    if (xhr.status !== 200) {
      const d = JSON.parse(xhr.responseText);
      throw new Error(d.error || 'Failed');
    }
    log('Mounted — click Download to save decrypted files', 'ok');
    const name = imgFile.name.replace(/\.[^.]+$/, '') + '_dec.zip';
    $('ct').innerHTML =
      '<div class="drop"><div class="dlbl">' + t('status.decrypt_ok', 'Decrypted successfully!') + '</div>'
      + '<a class="dlnk" href="/api/download" download="' + esc(name) + '">' + t('status.download_zip', 'Download .zip') + '</a>'
      + '<br><button class="bbtn" style="margin-top:12px" onclick="fetch(\'/api/unmount\');renderCt()">' + t('status.done', 'Done') + '</button></div>';
  } catch (e) {
    log('Error: ' + e.message, 'err');
    renderCt();
  }
  bsy = false;
}

async function encDrop(files, folderName) {
  if (bsy || !files || !files.length) return;
  const aidv = document.getElementById('eaid') ? document.getElementById('eaid').value.trim() : '';
  const isPS4 = document.getElementById('eps4') ? document.getElementById('eps4').checked : false;
  bsy = true;

  try {
    /* Calculate total size for PFS image sizing */
    let totalSize = 0;
    for (const f of files) totalSize += f.size;

    /* Step 1: create fresh PFS image and mount it */
    log('Creating ' + (isPS4 ? 'PS4' : 'PS5') + ' PFS image (' + fmtB(totalSize) + ' of files)...');
    $('ct').innerHTML = '<div class="drop"><div class="dlbl">' + t('status.creating_pfs', 'Creating PFS image...') + '</div></div>';

    /* Step 2: upload each file */
    for (let i = 0; i < files.length; i++) {

function setupImportDZ(id) {
  const el = $(id);
  if (!el) return;
  el.ondragover = e => { e.preventDefault(); el.classList.add('over') };
  el.ondragleave = e => { e.preventDefault(); el.classList.remove('over') };
  el.ondrop = async e => {
    e.preventDefault(); el.classList.remove('over');
    const items = e.dataTransfer.items;
    const entries = [];
    if (items) {
      for (let i = 0; i < items.length; i++) {
        const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
        if (entry) entries.push(entry);
      }
    }
    if (entries.length && entries[0].isDirectory) {
      const all = await readEntryRecursive(entries[0], '');
      if (all.length) importDrop(all, entries[0].name);
    } else {
      importEncrypted(e.dataTransfer.files);
    }
  };
}

/* Show zeroed SFO modal with DB title picker. Returns {type:'anyway'|'regen', tid, dir} or 'cancel' */
async function showSfoModal(opts) {
  const hasAnyway = opts && opts.anyway;
  let titles = [];
  try {
    const r = await fetch('/api/db_titles?uid=' + encodeURIComponent(curUid));
    const d = await r.json();
    titles = d.titles || [];
  } catch(e) {}
  return new Promise(resolve => {
    const m = document.createElement('div');
    m.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:999';
    const listHtml = titles.length ? titles.map((t,i) =>
      '<div class="sfo-row" data-i="'+i+'" style="display:flex;align-items:center;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--bd);transition:background .15s"'
      + ' onmouseenter="this.style.background=\'var(--s2)\'" onmouseleave="this.style.background=\'\'">'
      + '<div style="flex:1;text-align:left"><div style="font-size:13px;color:var(--tx)">' + (t.title||t.tid) + '</div>'
      + '<div style="font-size:11px;color:var(--dm)">' + t.tid + ' / ' + t.dir + (t.ps4?' (PS4)':'') + '</div></div></div>'
    ).join('') : '<div style="padding:16px;color:var(--dm);font-size:12px">' + t('import.no_titles', 'No titles found in database') + '</div>';
    m.innerHTML =
      '<div style="background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:0;max-width:420px;width:90%;max-height:80vh;display:flex;flex-direction:column">'
      + '<div style="padding:16px 20px 12px;border-bottom:1px solid var(--bd)">'
      + '<div style="font-size:14px;color:var(--tx);font-weight:600">' + t('import.zeroed_sfo', 'Zeroed param.sfo detected') + '</div>'
      + '<div style="font-size:12px;color:var(--dm);margin-top:4px">' + t('import.select_title_regen', 'Select a title from the database to regenerate') + '</div></div>'
      + '<div id="sfList" style="overflow-y:auto;max-height:40vh">' + listHtml + '</div>'
      + '<div id="sfStatus" style="font-size:11px;color:var(--dm);padding:4px 20px;min-height:16px"></div>'
      + '<div style="padding:12px 20px 16px;border-top:1px solid var(--bd);display:flex;gap:8px">'
      + (hasAnyway ? '<button class="btn grn" style="flex:1" id="sfAnyway">' + t('import.anyway', 'Import Anyway') + '</button>' : '')
      + '<button class="btn red" style="flex:1" id="sfCancel">' + t('common.cancel', 'Cancel') + '</button></div></div>';
    document.body.appendChild(m);
    m.querySelectorAll('.sfo-row').forEach(row => {
      row.onclick = async () => {
        const title = titles[parseInt(row.dataset.i)];
        m.querySelectorAll('.sfo-row').forEach(r => r.style.background = '');
        row.style.background = 'var(--ac)';
        row.style.borderRadius = '6px';
        m.querySelector('#sfStatus').textContent = t('import.regenerating', 'Regenerating from {source}...', {source: title.tid + '/' + title.dir});
        try {
          const rr = await fetch('/api/regen_sfo?title_id=' + encodeURIComponent(title.tid) + '&dir_name=' + encodeURIComponent(title.dir));
          const rd = await rr.json();
          if (rd.error) { m.querySelector('#sfStatus').innerHTML = '<span style="color:#f44">' + rd.error + '</span>'; return; }
          m.remove(); resolve({type:'regen', tid:title.tid, dir:title.dir});
        } catch(e) { m.querySelector('#sfStatus').innerHTML = '<span style="color:#f44">' + esc(t('status.error', 'Error: {error}', {error: e.message})) + '</span>'; }
      };
    });
    if (hasAnyway) {
      m.querySelector('#sfAnyway').onclick = () => { m.remove(); resolve({type:'anyway', tid:'', dir:''}); };
    }
    m.querySelector('#sfCancel').onclick = () => { m.remove(); resolve('cancel'); };
  });
}

async function doImportFinish() {
  log('Importing to system...');
  $('ct').innerHTML = '<div class="drop"><div class="dlbl">' + t('status.importing', 'Importing save to system...') + '</div></div>';
  let r = await fetch('/api/import_finish?uid=' + encodeURIComponent(curUid));
  let d = await r.json();
  if (d.sfo_zeroed) {
    const choice = await showSfoModal({anyway: true});
    if (choice && choice.type === 'regen') {
      log('param.sfo regenerated', 'ok');
      r = await fetch('/api/import_finish?uid=' + encodeURIComponent(curUid));
      d = await r.json();
      if (d.error) throw new Error(d.error);
    } else if (choice && choice.type === 'anyway') {
      log('Importing with zeroed param.sfo...');
      r = await fetch('/api/import_finish?uid=' + encodeURIComponent(curUid) + '&force=1');
      d = await r.json();
      if (d.error) throw new Error(d.error);
    } else {
      log('Import cancelled');
      try { await fetch('/api/unmount'); } catch(x) {}
      renderCt();
      return;
    }
  }
  if (d.error) throw new Error(d.error);
  log('Import complete: ' + d.title_id + '/' + d.dir_name + (d.exists ? ' (updated)' : ' (new)'), 'ok');
  showImportSuccess(d);
}

/* ── Mount & browse save ───────────────────────────── */
async function mountBrw(i) {
  if (bsy) return;
  bsy = true;
  const s = S[i];
  try {
    log('Mounting ' + s.title_id + '/' + s.save_name + '...');
    let r = await fetch('/api/mount?idx=' + i);
    let d = await r.json();
    if (d.error) { log('Mount failed: ' + d.error, 'err'); bsy = false; renderCt(); return }
    mt = true;
    cf = d.files || [];
    aid = d.account_id || '';
    stitle = d.save_title || '';
    mtid = d.title_id || '';
    mpt = d.mount || '';
    ex = new Set();
    /* folders start collapsed */
    log('Mounted ' + (mtid ? mtid + ' ' : '') + (stitle ? stitle + ' ' : '') + (aid ? '[' + aid + ']' : ''), 'ok');
    renderF();
    if (d.sfo_zeroed) {
      const result = await showSfoModal({anyway: false});
      if (result && result.type === 'regen') {
        log('param.sfo regenerated', 'ok');
        let r2 = await fetch('/api/mount?idx=' + i);
        let d2 = await r2.json();
        if (!d2.error) {
          cf = d2.files || [];
          aid = d2.account_id || '';
          stitle = d2.save_title || '';
          mtid = d2.title_id || '';
          renderF();
        }
      }
    }
  } catch (e) {
    log('Error: ' + e.message, 'err');
  }
  bsy = false;
  renderTB();
}

/* ── Render file tree ──────────────────────────────── */
function renderF() {
  $('ct').className = 'ct';
  const isUsb = si >= 0 && S[si] && S[si].usb;
  let h = '';
  cf.forEach((f, i) => {
    const ps = f.name.split('/');
    ps.pop();
    let pp = '', vis = true;
    for (let j = 0; j < ps.length; j++) {
      pp = j ? pp + '/' + ps[j] : ps[j];
      if (!ex.has(pp)) { vis = false; break }
    }
    if (!vis) return;
    const d = f.name.split('/').length - 1;
    const nm = f.name.split('/').pop();
    if (f.dir) {
      const o = ex.has(f.name);
      const fn = esc(f.name).replace(/'/g, "\\'");
      h += '<div class="fi dir" style="padding-left:' + (16 + d * 16) + 'px" onclick="tog(' + i + ')">';
      h += (o ? '\u25BE \u{1F4C1} ' : '\u25B8 \u{1F4C1} ') + esc(nm);
      if (!isUsb) h += '<span class="dir-dots" onclick="event.stopPropagation();showDirMenu(event,\'' + fn + '\')">\u22EE</span>';
      h += '</div>';
    } else {
      const fn = esc(f.name).replace(/'/g, "\\'");
      const clickAttr = ' onclick="openEditor(\'' + fn + '\',' + f.size + ')" style="cursor:pointer;padding-left:' + (16 + d * 16) + 'px"';
      if (isUsb) {
        h += '<div class="fi"' + clickAttr + '>';
      } else {
        h += '<div class="fi"' + clickAttr + ' oncontextmenu="showCtxMenu(event,\'' + fn + '\')">';
      }
      h += '\u{1F4C4} ' + esc(nm)
        + '<span class="dir-dots" onclick="event.stopPropagation();showCtxMenu(event,\'' + fn + '\')">\u22EE</span>'
        + '<span class="sz">' + fmtB(f.size) + '</span></div>';
    }
  });
  if (!isUsb) h += '<div class="dh" style="opacity:1;font-size:12px">' + t('file.tip', 'Tip: Drag & drop files here to add or replace them') + '</div>';
  $('ct').innerHTML = h || '<div class="empty">' + t('common.empty', 'Empty') + '</div>';
  if (!isUsb) {
    $('ct').oncontextmenu = e => {
      if (!e.target.closest('.fi:not(.dir)')) { e.preventDefault(); showCtxMenu(e, null); }
    };
    setupDZ('ct', handleBrw);
  }
}

function uploadToDir(dirName) {
  closeCtxMenu();
  const i = document.createElement('input');
  i.type = 'file'; i.multiple = true;
  i.onchange = async () => {
    if (!i.files.length || bsy || !mt) return;
    bsy = true;
    try {
      for (let j = 0; j < i.files.length; j++) {
        const file = i.files[j];
        const relPath = dirName + '/' + file.name;
        log('Uploading ' + relPath + ' (' + fmtB(file.size) + ')...');
        const r = await fetch('/api/upload_file?name=' + encodeURIComponent(relPath), {
          method: 'POST',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: file
        });
        const d = await r.json();
        if (d.ok) log('Added ' + relPath, 'ok');
        else log(d.error, 'err');
      }
      const r2 = await fetch('/api/files');
      const d2 = await r2.json();
      cf = d2.files || [];
      /* folders start collapsed */
      renderF();
    } catch (e) {
      log('Error: ' + e.message, 'err');
    }
    bsy = false;
  };
  i.click();
}

async function importSingleUsb(idx) {
  closeCtxMenu();
  if (bsy) return;
  const s = S[idx];
  const exists = S.some((x, i) => i !== idx && !x.usb && x.title_id === s.title_id && x.save_name === s.save_name);
  if (exists) {
    const ok = await showConfirmModal(t('confirm.overwrite_save', 'This will overwrite an existing save. Are you sure?'));
    if (!ok) return;
  }
  bsy = true;
  try {
    log('Importing ' + s.title_id + '/' + s.save_name + ' to system...');
    let r = await fetch('/api/import_usb_save?idx=' + idx + '&uid=' + encodeURIComponent(curUid));
    let d = await r.json();
    if (d.error) throw new Error(d.error);
    log('Imported ' + d.title_id + '/' + d.dir_name, 'ok');
    await load();
    renderL();
  } catch(e) {
    log('Import failed: ' + e.message, 'err');
  }
  bsy = false;
}

async function importAllUsb(titleId) {
  closeCtxMenu();
  if (bsy) return;
  const usbSaves = S.map((s, i) => ({s, i})).filter(x => x.s.usb && x.s.title_id === titleId);
  if (usbSaves.length === 0) { log('No USB saves found for ' + titleId, 'err'); return; }
  const existingAny = usbSaves.some(x => S.some((s2, j) => j !== x.i && !s2.usb && s2.title_id === x.s.title_id && s2.save_name === x.s.save_name));
  const msg = t('confirm.import_all', 'Import {count} save(s) for {title} to system?', {count: usbSaves.length, title: esc(titleId)})
    + (existingAny ? '<br><br>' + t('confirm.some_overwritten', 'Some saves already exist and will be overwritten.') : '');
  const ok = await showConfirmModal(msg, t('toolbar.import_all', 'Import All'), t('common.cancel', 'Cancel'));
  if (!ok) return;
  bsy = true; renderTB();
  let imported = 0, failed = 0;
  for (const x of usbSaves) {
    try {
      log('Importing ' + x.s.save_name + '...');
      const r = await fetch('/api/import_usb_save?idx=' + x.i + '&uid=' + encodeURIComponent(curUid));
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      imported++;
      log('Imported ' + d.title_id + '/' + d.dir_name, 'ok');
    } catch(e) {
      failed++;
      log('Failed to import ' + x.s.save_name + ': ' + e.message, 'err');
    }
  }
  log('Import complete: ' + imported + ' imported' + (failed ? ', ' + failed + ' failed' : ''), imported > 0 ? 'ok' : 'err');
  await load();
  renderL();
  bsy = false; renderTB();
}

}

/* ── Hex / Text Editor (server-side) ──────────────── */
let edName = '';           /* file path relative to mount */
let edTotal = 0;           /* total file size */
let edMode = 'hex';        /* 'hex' or 'text' */
let edOpen = false;        /* file open on server */
let edRowH = 22;           /* row height in px */
let edFontSize = 14;       /* hex editor font size */
let edCache = {};          /* local cache: offset → Uint8Array */
let edDirty = {};          /* dirty bytes: offset → value */
let edTextDirty = false;   /* text mode has unsaved edits */
let edTextLoaded = 0;      /* bytes loaded into textarea so far */
let edTextLoading = false; /* currently fetching next chunk */
const ED_TEXT_CHUNK = 65536; /* bytes per text chunk */

async function openEditor(name, size) {
  if (bsy) return;
  edName = name; edTotal = size; edMode = 'hex';
  edOpen = false; edCache = {}; edDirty = {}; edTextDirty = false; edTextLoaded = 0;
  renderEditorShell();
  try {
    const r = await fetch('/api/editor/open?name=' + encodeURIComponent(name));
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    edTotal = d.size;
    edOpen = true;
    renderEditorShell();
    if (edMode === 'hex') edRenderRows();
    log('Opened ' + name + ' (' + fmtB(edTotal) + ')', 'ok');
  } catch(e) { log('Error: ' + e.message, 'err'); }
}

/* Fetch a range of bytes from server, with caching */
const ED_PAGE = 4096;
async function edFetchRange(off, len) {
  /* Align to page boundaries */
  const pageStart = Math.floor(off / ED_PAGE) * ED_PAGE;
  const pageEnd = Math.min(Math.ceil((off + len) / ED_PAGE) * ED_PAGE, edTotal);
  /* Check if all pages cached */
  let allCached = true;
  for (let p = pageStart; p < pageEnd; p += ED_PAGE) {
    if (!edCache[p]) { allCached = false; break; }
  }
  if (!allCached) {
    try {
      const r = await fetch('/api/editor/read?offset=' + pageStart + '&length=' + (pageEnd - pageStart));
      const ab = await r.arrayBuffer();
      const data = new Uint8Array(ab);
      /* Split into pages */
      for (let p = pageStart; p < pageEnd; p += ED_PAGE) {
        const poff = p - pageStart;
        const plen = Math.min(ED_PAGE, data.length - poff);
        if (plen > 0) edCache[p] = data.slice(poff, poff + plen);
      }
    } catch(e) { return null; }
  }
  /* Assemble result from cache */
  const result = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    const addr = off + i;
    if (addr >= edTotal) break;
    /* Check dirty bytes first */
    if (edDirty[addr] !== undefined) { result[i] = edDirty[addr]; continue; }
    const page = Math.floor(addr / ED_PAGE) * ED_PAGE;
    const c = edCache[page];
    if (c) result[i] = c[addr - page];
  }
  return result;
}

function edGetCachedByte(off) {
  if (off >= edTotal) return null;
  if (edDirty[off] !== undefined) return { v: edDirty[off], dirty: true };
  const page = Math.floor(off / ED_PAGE) * ED_PAGE;
  const c = edCache[page];
  if (!c) return null;
  const idx = off - page;
  if (idx >= c.length) return null;
  return { v: c[idx], dirty: false };
}

function edZoom(dir) {
  edFontSize = Math.max(10, Math.min(24, edFontSize + dir));
  edRowH = Math.round(edFontSize * 1.6);
  renderEditorShell();
  if (edMode === 'hex') edRenderRows();
}

function renderEditorShell() {
  const c = $('ct');
  c.className = 'ct';
  const fname = edName.split('/').pop();
  const isUsb = si >= 0 && S[si] && S[si].usb;
  let bar = '<div class="editor-bar">'
    + '<button class="ebtn" onclick="closeEditor()">\u2190 ' + t('common.back', 'Back') + '</button>'
    + '<button class="ebtn' + (edMode==='hex'?' eact':'') + '" onclick="edSwitchMode(\'hex\')">' + t('editor.hex', 'Hex') + '</button>'
    + '<button class="ebtn' + (edMode==='text'?' eact':'') + '" onclick="edSwitchMode(\'text\')">' + t('editor.text', 'Text') + '</button>'
    + '<span class="ename">' + esc(fname) + '</span>'
    + '<span class="esz">' + fmtB(edTotal) + '</span>'
    + '<button class="ebtn" onclick="edZoom(-1)" style="padding:4px 8px;font-size:14px">\u2212</button>'
    + '<span style="font-size:11px;color:var(--dm);min-width:30px;text-align:center">' + edFontSize + 'px</span>'
    + '<button class="ebtn" onclick="edZoom(1)" style="padding:4px 8px;font-size:14px">+</button>';
  if (!isUsb) bar += '<button class="ebtn" style="border-color:var(--ok);color:var(--ok)" onclick="saveEditor()">' + t('common.save', 'Save') + '</button>';
  bar += '</div>';

  if (edMode === 'hex') {
    const totalRows = Math.ceil(edTotal / 16);
    const totalH = totalRows * edRowH;
    c.innerHTML = bar
      + '<div class="hex-wrap" id="hexwrap" style="position:relative;font-size:' + edFontSize + 'px">'
      + '<div id="hexspacer" style="height:' + totalH + 'px;pointer-events:none"></div>'
      + '<div id="hexview" style="position:absolute;top:0;left:0;right:0"></div>'
      + '</div>';
    const wrap = $('hexwrap');
    if (wrap) wrap.onscroll = edOnScroll;
  } else {
    c.innerHTML = bar
      + '<div class="text-wrap">'
      + '<pre id="texthl"></pre>'
      + '<textarea id="textedit" spellcheck="false">' + t('editor.loading', 'Loading...') + '</textarea>'
      + '</div>'
      + '<div id="etload" style="display:none;text-align:center;padding:4px;font-size:11px;color:var(--dm)">' + t('editor.loading_more', 'Loading more...') + '</div>';
    edTextLoaded = 0;
    edLoadTextChunk();
  }
}

let edScrollTimer = null;
function edOnScroll() {
  if (edScrollTimer) return;
  edScrollTimer = setTimeout(() => { edScrollTimer = null; edRenderRows(); }, 16);
}

async function edRenderRows() {
  const wrap = $('hexwrap');
  const view = $('hexview');
  if (!wrap || !view || !edOpen) return;

  const scrollTop = wrap.scrollTop;
  const viewH = wrap.clientHeight;
  const firstRow = Math.max(0, Math.floor(scrollTop / edRowH) - 5);
  const lastRow = Math.min(Math.ceil(edTotal / 16), Math.ceil((scrollTop + viewH) / edRowH) + 5);

  /* Prefetch visible range */
  const startOff = firstRow * 16;
  const endOff = Math.min(lastRow * 16, edTotal);
  await edFetchRange(startOff, endOff - startOff);

  let h = '';
  for (let row = firstRow; row < lastRow; row++) {
    const off = row * 16;
    const top = row * edRowH;
    h += '<div class="hex-row" style="position:absolute;top:' + top + 'px;height:' + edRowH + 'px;left:0;right:0">';
    h += '<span class="hex-off">' + off.toString(16).toUpperCase().padStart(8, '0') + '</span>';
    h += '<span class="hex-bytes">';
    for (let j = 0; j < 16; j++) {
      const boff = off + j;
      if (boff < edTotal) {
        const b = edGetCachedByte(boff);
        if (b) {
          const cls = b.dirty ? ' class="dirty"' : '';
          h += '<span' + cls + ' onclick="editByte(' + boff + ')">' + b.v.toString(16).toUpperCase().padStart(2, '0') + '</span> ';
        } else {
          h += '<span style="color:var(--bd)">??</span> ';
        }
      } else {
        h += '   ';
      }
      if (j === 7) h += ' ';
    }
    h += '</span><span class="hex-sep"></span><span class="hex-ascii">';
    for (let j = 0; j < 16; j++) {
      const boff = off + j;
      if (boff >= edTotal) break;
      const b = edGetCachedByte(boff);
      if (b) {
        const ch = (b.v >= 32 && b.v <= 126) ? String.fromCharCode(b.v) : '.';
        const cls = b.dirty ? ' class="dirty"' : '';
        h += '<span' + cls + ' onclick="editByte(' + boff + ')">' + esc(ch) + '</span>';
      } else {
        h += '<span style="color:var(--bd)">.</span>';
      }
    }
    h += '</span></div>';
  }
  view.innerHTML = h;
}

/* Load next text chunk from server and append */
async function edLoadTextChunk() {
  if (!edOpen || edTextLoading || edTextLoaded >= edTotal) return;
  edTextLoading = true;
  const loadEl = $('etload');
  if (loadEl) loadEl.style.display = 'block';
  const ta = $('textedit');
  if (!ta) { edTextLoading = false; return; }
  const len = Math.min(ED_TEXT_CHUNK, edTotal - edTextLoaded);
  try {
    const r = await fetch('/api/editor/read?offset=' + edTextLoaded + '&length=' + len);
    const ab = await r.arrayBuffer();
    const dec = new TextDecoder('utf-8', {fatal: false});
    const chunk = dec.decode(new Uint8Array(ab));
    if (edTextLoaded === 0) {
      ta.value = chunk;
      ta._origText = chunk;
      edTextDirty = false;
    } else {
      const scrollPos = ta.scrollTop;
      const selStart = ta.selectionStart;
      const selEnd = ta.selectionEnd;
      ta.value += chunk;
      ta.scrollTop = scrollPos;
      ta.setSelectionRange(selStart, selEnd);
    }
    /* Update highlighting */
    const hl = $('texthl');
    if (hl) {
      try { hl.innerHTML = hlApply(ta.value); } catch(e) { hl.textContent = ta.value; }
    }
    ta.oninput = function() {
      edTextDirty = true;
      hlDebounce();
    };
    edTextLoaded += ab.byteLength;
    ta.onscroll = function() {
      const hl = $('texthl');
      if (hl) { hl.scrollTop = this.scrollTop; hl.scrollLeft = this.scrollLeft; }
      if (edTextLoaded < edTotal && !edTextLoading) {
        if (this.scrollTop + this.clientHeight >= this.scrollHeight - 200) {
          edLoadTextChunk();
        }
      }
    };
  } catch(e) {
    if (edTextLoaded === 0) ta.value = 'Error: ' + e.message;
  }
  if (loadEl) loadEl.style.display = (edTextLoaded < edTotal) ? 'none' : 'none';
  edTextLoading = false;
}

async function edFlushText() {
  if (!edTextDirty) return;
  const ta = $('textedit');
  if (!ta) return;
  const enc = new TextEncoder();
  const data = enc.encode(ta.value);
  try {
    await fetch('/api/editor/patch?offset=0', {
      method: 'POST',
      headers: {'Content-Type': 'application/octet-stream'},
      body: data
    });
    edTextDirty = false;
    edCache = {};
  } catch(e) { log('Flush failed: ' + e.message, 'err'); }
}

/* ── Syntax highlighting ──────────────────────────── */
function hlDetect(txt) {
  const t = txt.trimStart();
  if (t[0] === '{' || t[0] === '[') return 'json';
  if (t[0] === '<') return 'xml';
  return 'plain';
}

let edHlTimer = null;
function hlApply(txt) {
  const lang = hlDetect(txt);
  try {
    if (lang === 'json') return hlJSON(txt);
    if (lang === 'xml') return hlXML(txt);
  } catch(e) {}
  return esc(txt) + '\n';
}

/* Debounced highlight update — avoids freezing on large files */
function hlDebounce() {
  if (edHlTimer) clearTimeout(edHlTimer);
  edHlTimer = setTimeout(() => {
    edHlTimer = null;
    const ta = $('textedit');
    const hl = $('texthl');
    if (!ta || !hl) return;
    try { hl.innerHTML = hlApply(ta.value); } catch(e) { hl.textContent = ta.value; }
  }, 300);
}

function hlJSON(txt) {
  return esc(txt).replace(
    /(&quot;)((?:[^&]|&(?!quot;))*?)(&quot;)\s*:/g,
    '<span class="hl-key">$1$2$3</span>:'
  ).replace(
    /:\s*(&quot;)((?:[^&]|&(?!quot;))*?)(&quot;)/g,
    ': <span class="hl-str">$1$2$3</span>'
  ).replace(
    /(&quot;)((?:[^&]|&(?!quot;))*?)(&quot;)/g,
    '<span class="hl-str">$1$2$3</span>'
  ).replace(
    /\b(-?\d+\.?\d*(?:[eE][+-]?\d+)?)\b/g,
    '<span class="hl-num">$1</span>'
  ).replace(
    /\b(true|false)\b/g,
    '<span class="hl-bool">$1</span>'
  ).replace(
    /\b(null)\b/g,
    '<span class="hl-null">$1</span>'
  ) + '\n';
}

function hlXML(txt) {
  return esc(txt).replace(
    /(&lt;!--)([\s\S]*?)(--&gt;)/g,
    '<span class="hl-cmt">$1$2$3</span>'
  ).replace(
    /(&lt;\/?)([\w:.-]+)/g,
    '$1<span class="hl-tag">$2</span>'
  ).replace(
    /\b([\w:.-]+)(=)(&quot;)((?:[^&]|&(?!quot;))*?)(&quot;)/g,
    '<span class="hl-attr">$1</span>$2<span class="hl-aval">$3$4$5</span>'
  ) + '\n';
}

function edHasEdits() {
  if (Object.keys(edDirty).length > 0) return true;
  if (edTextDirty) return true;
  return false;
}

async function edSwitchMode(mode) {
  if (mode === edMode) return;
  /* If switching from text, flush current page edits */
  if (edMode === 'text') await edFlushText();
  /* If switching from hex with dirty bytes, send patches */
  if (edMode === 'hex' && Object.keys(edDirty).length > 0) {
    await edFlushDirty();
  }
  edMode = mode;
  renderEditorShell();
  if (mode === 'hex') edRenderRows();
}

async function edFlushDirty() {
  const keys = Object.keys(edDirty).map(Number).sort((a,b) => a - b);
  if (keys.length === 0) return;
  /* Group consecutive dirty bytes into patches */
  let start = keys[0], prev = keys[0];
  const patches = [];
  for (let i = 1; i <= keys.length; i++) {
    if (i < keys.length && keys[i] === prev + 1) { prev = keys[i]; continue; }
    const len = prev - start + 1;
    const data = new Uint8Array(len);
    for (let j = 0; j < len; j++) data[j] = edDirty[start + j];
    patches.push({off: start, data: data});
    if (i < keys.length) { start = keys[i]; prev = keys[i]; }
  }
  for (const p of patches) {
    try {
      await fetch('/api/editor/patch?offset=' + p.off, {
        method: 'POST',
        headers: {'Content-Type': 'application/octet-stream'},
        body: p.data
      });
    } catch(e) {}
  }
  /* Update cache with dirty values */
  for (const k of keys) {
    const page = Math.floor(k / ED_PAGE) * ED_PAGE;
    if (edCache[page]) edCache[page][k - page] = edDirty[k];
  }
  edDirty = {};
}

function editByte(off) {
  const isUsb = si >= 0 && S[si] && S[si].usb;
  if (isUsb || !edOpen || off >= edTotal) return;
  const b = edGetCachedByte(off);
  const cur = b ? b.v.toString(16).toUpperCase().padStart(2, '0') : '00';
  const val = prompt(t('editor.edit_byte', 'Edit byte at 0x{offset} (hex):', {offset: off.toString(16).toUpperCase()}), cur);
  if (val === null) return;
  const parsed = parseInt(val, 16);
  if (isNaN(parsed) || parsed < 0 || parsed > 255) { log('Invalid byte value', 'err'); return; }
  edDirty[off] = parsed;
  edRenderRows();
}

async function saveEditor() {
  if (bsy) return;
  bsy = true;
  try {
    /* Flush any pending edits to server buffer */
    if (edMode === 'text') await edFlushText();
    if (edMode === 'hex') await edFlushDirty();

    /* Tell server to write buffer to file */
    log('Saving ' + edName + '...');
    const r = await fetch('/api/editor/save');
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    log('Saved ' + edName + ' (' + fmtB(d.written) + ')', 'ok');
    if (edMode === 'text') {
      const ta = $('textedit');
      if (ta) ta._origText = ta.value;
    }
  } catch(e) { log('Save failed: ' + e.message, 'err'); }
  bsy = false;
}

async function closeEditor() {
  if (edHasEdits()) {
    if (!confirm(t('editor.discard_changes', 'You have unsaved changes. Discard?'))) return;
  }
  try { await fetch('/api/editor/close'); } catch(e) {}
  edName = ''; edTotal = 0; edOpen = false; edCache = {}; edDirty = {}; edTextDirty = false;
  renderF();
}

/* ── Confirm replace modal ─────────────────────────── */
function confirmReplace(name) {
  return new Promise(res => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML =
      '<div class="modal"><h3>' + t('file.exists', 'File already exists') + '</h3>'
      + '<p>' + t('file.replace_question', '<b>{name}</b> already exists in this save. Replace it?', {name: esc(name)}) + '</p>'
      + '<div class="btns">'
      + '<button class="mbtn-s" id="mskip">' + t('common.skip', 'Skip') + '</button>'
      + '<button class="mbtn-r" id="mrep">' + t('common.replace', 'Replace') + '</button>'
      + '</div></div>';
    document.body.appendChild(bg);
    $("mrep").onclick = () => { bg.remove(); res(true) };
    $("mskip").onclick = () => { bg.remove(); res(false) };
  });
}

/* ── Handle file drop in browse mode ───────────────── */
async function handleBrw(files) {
  if (bsy || !mt || tab !== 'browse') return;
  bsy = true;
  try {
    for (let j = 0; j < files.length; j++) {
      const file = files[j];
      if (file.name.endsWith('.zip')) {
        log('Extracting ' + file.name + ' (' + fmtB(file.size) + ')...');
        const r = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: file
        });
        const d = await r.json();
        log('Extracted ' + d.files + ' files', 'ok');
      } else {
        const ck = await fetch('/api/file_exists?name=' + encodeURIComponent(file.name));
        const ce = await ck.json();
        if (ce.exists) {
          const ok = await confirmReplace(file.name);
          if (!ok) { log('Skipped ' + file.name); continue }
        }
        log('Uploading ' + file.name + ' (' + fmtB(file.size) + ')...');
        const r = await fetch('/api/upload_file?name=' + encodeURIComponent(file.name), {
          method: 'POST',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: file
        });
        const d = await r.json();
        if (d.ok) log('Added ' + file.name, 'ok');
        else log(d.error, 'err');
      }
    }
    const r2 = await fetch('/api/files');
    const d2 = await r2.json();
    cf = d2.files || [];
    ex = new Set();
    /* folders start collapsed */
    renderF();
  } catch (e) {
    log('Error: ' + e.message, 'err');
  }
  bsy = false;
}

/* ── Download as .zip ──────────────────────────────── */
async function dlZip() {
  if (bsy) return;
  bsy = true; renderTB();
  try {
    log('Downloading zip...');
    const r = await fetch('/api/download');
    const b = await r.blob();
    const s = si >= 0 ? S[si] : null;
    dl(b, s ? (s.title_id + '_' + s.save_name + '.zip') : 'save.zip');
    log('Downloaded ' + fmtB(b.size), 'ok');
  } catch (e) {
    log('Error: ' + e.message, 'err');
  }
  bsy = false; renderTB();
}

/* ── Download encrypted binary ─────────────────────── */
async function dlBin() {
  if (bsy || si < 0) return;
  bsy = true; renderTB();
  const s = S[si];
  try {
    log('Unmounting to finalize...');
    await fetch('/api/unmount'); mt = false;
    log('Downloading encrypted save...');
    const isPS4 = s.type === 'ps4';
    const r = await fetch('/api/download_raw?idx=' + si);
    const b = await r.blob();
    const fname = isPS4 ? (s.title_id + '_' + s.save_name + '_enc.zip') : (s.title_id + '_' + s.save_name);
    dl(b, fname);
    log('Downloaded ' + fmtB(b.size), 'ok');
    si = -1; renderL(); renderTB(); renderCt();
  } catch (e) {
    log('Error: ' + e.message, 'err');
  }
  bsy = false;
}

async function pollCloudStatus() {
  try {
    const r = await fetch('/api/cloud/status');
    const d = await r.json();
    if (d.running) {
      const msg = 'Cloud backup: ' + (d.active || 'uploading')
        + (d.progress ? ' (' + d.progress + '%)' : '');
      if (msg !== lastCloudProgress) {
        lastCloudProgress = msg;
        log(msg);
      }
      return;
    }
    lastCloudProgress = '';
    if (!cloudAwaiting) return;
    cloudAwaiting = false;
    cloudBusy = false;
    if (cloudPoll) { clearInterval(cloudPoll); cloudPoll = null; }
    if (d.last_ok) log('Cloud backup uploaded to ' + d.last_remote, 'ok');
    else log('Cloud backup failed: ' + (d.last_error || d.config_error || 'unknown error'), 'err');
  } catch (e) {
    cloudAwaiting = false;
    cloudBusy = false;
    lastCloudProgress = '';
    if (cloudPoll) { clearInterval(cloudPoll); cloudPoll = null; }
    log('Cloud status failed: ' + e.message, 'err');
  }
  bsy = false; renderTB(); renderCt();
}

function startCloudPoll() {
  cloudAwaiting = true;
  if (cloudPoll) clearInterval(cloudPoll);
  cloudPoll = setInterval(pollCloudStatus, 2000);
  pollCloudStatus();
}

function filenameFromDisposition(h, fallback) {
  const m = h && h.match(/filename="([^"]+)"/);
  return m ? m[1] : fallback;
}

function xhrPutWithProgress(url, token, blob, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', url);
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.setRequestHeader('Content-Type', 'application/zip');
    xhr.setRequestHeader('Content-Range', 'bytes 0-' + (blob.size - 1) + '/' + blob.size);
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded, e.total);
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve(xhr);
      else reject(new Error('Drive upload failed: HTTP ' + xhr.status + ' ' + xhr.responseText));
    };
    xhr.onerror = () => reject(new Error('Drive upload network error'));
    xhr.send(blob);
  });
}

async function uploadBlobToDrive(blob, filename, cfg) {
  const gd = cfg.google_drive || {};
  if (!gd.folder_id) throw new Error('Google Drive Folder ID is required');
  const token = await driveAccessToken(cfg);
  const metadata = { name: filename, mimeType: 'application/zip' };
  metadata.parents = [gd.folder_id];
  const init = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&supportsAllDrives=true', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json; charset=UTF-8',
      'X-Upload-Content-Type': 'application/zip',
      'X-Upload-Content-Length': String(blob.size)
    },
    body: JSON.stringify(metadata)
  });
  if (!init.ok) {
    const errText = await init.text();
    if (init.status === 403 && errText.indexOf('Service Accounts do not have storage quota') >= 0) {
      throw new Error('Service accounts cannot upload to normal My Drive folders because they have no storage quota. Use OAuth2 Refresh Token auth for personal My Drive, or a Shared Drive with a service account.');
    }
    throw new Error('Drive session failed: HTTP ' + init.status + ' ' + errText);
  }
  const session = init.headers.get('Location');
  if (!session) throw new Error('Drive did not return an upload session');
  const xhr = await xhrPutWithProgress(session, token, blob, (loaded, total) => {
    const pct = Math.round(loaded * 100 / total);
    log('Google Drive upload ' + pct + '% (' + fmtB(loaded) + '/' + fmtB(total) + ')');
  });
  let result = {};
  try { result = JSON.parse(xhr.responseText || '{}'); } catch(e) {}
  return result;
}

async function loadCloudConfigForAction() {

async function googleDriveBackup(packageUrl, fallbackName, label) {
  const cfg = await loadCloudConfigForAction();
  const gd = cfg.google_drive || {};
  const targets = cfg.backup_targets || {};
  const driveTarget = (targets.google_drive && targets.google_drive.enabled) || cfg.provider === 'google_drive';
  if (!driveTarget || (gd.mode || 'browser') !== 'browser') return false;
  log('Packaging ' + label + ' for Google Drive...');
  const pr = await fetch(packageUrl);
  const ct = pr.headers.get('Content-Type') || '';
  if (ct.indexOf('application/json') >= 0) {
    const d = await pr.json();
    throw new Error(d.error || 'Package failed');
  }
  if (!pr.ok) throw new Error('Package failed: HTTP ' + pr.status);
  const blob = await pr.blob();
  const filename = filenameFromDisposition(pr.headers.get('Content-Disposition'), fallbackName);
  log('Uploading ' + filename + ' (' + fmtB(blob.size) + ') to Google Drive...');
  const result = await uploadBlobToDrive(blob, filename, cfg);
  log('Google Drive upload complete' + (result.id ? ': ' + result.id : ''), 'ok');
  return true;
}

function hasPs5BackupTargets(cfg) {
  const targets = cfg.backup_targets || {};
  return !!((targets.local && targets.local.enabled)
    || (targets.usb && targets.usb.enabled)
    || (targets.ftp && targets.ftp.enabled)
    || (!targets.ftp && cfg.provider === 'ftp'));
}

    if (count) log('Pending Google Drive backup queue: ' + count);
    return d.queue || [];
  } catch (e) {

async function drainDriveQueue(manual) {
  if (queueDraining) return;
  queueDraining = true;
  try {
    const cfg = await loadCloudConfigForAction();
    const gd = cfg.google_drive || {};
    if (cfg.provider !== 'google_drive' || (gd.mode || 'browser') !== 'browser') return;
    const queue = await loadDriveQueueStatus();
    if (!queue.length) {
      if (manual) log('No pending Google Drive backups');
      return;
    }
    await driveAccessToken(cfg);
    for (const item of queue) {
      const id = item.id;
      const filename = (item.filename || id) + '.zip';
      log('Uploading queued backup ' + filename + '...');
      const pr = await fetch('/api/cloud/queue_download?id=' + encodeURIComponent(id));
      if (!pr.ok) throw new Error('Queue download failed: HTTP ' + pr.status);
      const blob = await pr.blob();
      const result = await uploadBlobToDrive(blob, filename, cfg);
      const done = await fetch('/api/cloud/queue_done?id=' + encodeURIComponent(id), { method: 'POST' });
      const dd = await done.json();
      if (dd.error) throw new Error(dd.error);
      log('Queued Drive upload complete' + (result.id ? ': ' + result.id : ''), 'ok');
    }
    refreshAutoStatus();
  } catch (e) {
    if (manual) log('Pending Drive upload failed: ' + e.message, 'err');
  } finally {
    queueDraining = false;
  }
}

function waitCloudUploadDone() {
  return new Promise((resolve, reject) => {
    const started = Date.now();
    const iv = setInterval(async () => {
      try {
        const r = await fetch('/api/cloud/status');
        const d = await r.json();
        if (d.running) {
          if (Date.now() - started > 600000) {
            clearInterval(iv);
            reject(new Error('Cloud upload timed out after 10 minutes'));
          }
          return;
        }
        clearInterval(iv);
        if (d.last_ok) resolve(d);
        else reject(new Error(d.last_error || d.config_error || 'Cloud upload failed'));
      } catch (e) {
        clearInterval(iv);
        reject(e);
      }
    }, 2000);
  });
}

    'all saves in ' + titleId);
  if (handled) return;
  cloudBusy = true;
  const r = await fetch('/api/cloud/upload_title?id=' + encodeURIComponent(titleId) + '&mode=enc');
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  log('Cloud backup uploading all saves in ' + titleId + '...');
  await waitCloudUploadDone();
  cloudBusy = false;
  log('Cloud backup done: ' + titleId, 'ok');
}

async function bulkQueue(kind) {
  if (bsy || bulkRunning) return;
  const titles = visibleBulkTitles().filter(t => bulkSel.has(t));
  if (!titles.length) {
    log('No titles selected for bulk queue', 'err');
    return;
  }
  const labels = { dec: 'export all decrypted', enc: 'export all saves', cloud: 'cloud backup all' };
  bulkRunning = true;
  bsy = true;
  updateBulkBar();
  renderTB();
  log('Bulk queue: ' + titles.length + ' title(s) — ' + (labels[kind] || kind));
  let ok = 0, fail = 0;
  for (let n = 0; n < titles.length; n++) {
    const titleId = titles[n];
    log('[' + (n + 1) + '/' + titles.length + '] ' + titleId);
    try {
      if (kind === 'dec') await bulkExportTitle(titleId, true);
      else if (kind === 'enc') await bulkExportTitle(titleId, false);
      else if (kind === 'cloud') await bulkCloudBackupTitle(titleId);
      ok++;
    } catch (e) {
      fail++;
      log('Bulk item failed: ' + e.message, 'err');
      cloudBusy = false;
    }
  }
  bulkRunning = false;
  bsy = false;
  si = -1;
  updateBulkBar();
  renderL();
  renderTB();
  renderCt();
  log('Bulk queue finished: ' + ok + ' ok' + (fail ? ', ' + fail + ' failed' : ''), fail ? 'err' : 'ok');
}

/* ── Tables: columns that can be hidden, shown and resized (kept per table) ── */
/* cols: [{id, label, cell(row) -> html, w (px, optional), fixed (cannot hide), when() (column exists now)}] */
const TBL_REDRAW = {};
function tblPrefs(key) {
  try { return JSON.parse(localStorage.getItem('tbl.' + key) || '{}'); } catch (e) { return {}; }
}
function tblSave(key, p) { try { localStorage.setItem('tbl.' + key, JSON.stringify(p)); } catch (e) {} }
function uiTable(key, cols, rows, rowAttr, redraw) {
  if (redraw) TBL_REDRAW[key] = redraw;
  const p = tblPrefs(key), hid = p.hidden || {}, w = p.w || {};
  const vis = cols.filter(c => (!c.when || c.when()) && !(hid[c.id] && !c.fixed));
  let h = '<table class="ls-tbl ui-tbl" data-tbl="' + key + '"><colgroup>'
    + vis.map(c => '<col data-c="' + c.id + '"' + (w[c.id] || c.w ? ' style="width:' + (w[c.id] || c.w) + 'px"' : '') + '>').join('')
    + '<col style="width:34px"></colgroup><tr>'
    + vis.map(c => '<th data-c="' + c.id + '" oncontextmenu="tblColMenu(event,\'' + key + '\')">' + esc(c.label)
      + '<span class="col-rs" onpointerdown="tblResize(event,\'' + key + '\',\'' + c.id + '\')"></span></th>').join('')
    + '<th class="col-menu"><button class="iconbtn" title="' + esc(t('tbl.columns', 'Columns')) + '" onclick="tblColMenu(event,\'' + key + '\')">\u2630</button></th></tr>';
  rows.forEach((r, i) => {
    h += '<tr' + (rowAttr ? rowAttr(r, i) : '') + '>' + vis.map(c => '<td>' + c.cell(r) + '</td>').join('')
      + '<td style="text-align:right">' + (cols.rowMenu ? cols.rowMenu(r) : '') + '</td></tr>';
  });
  TBL_COLS[key] = cols;
  return h + '</table>';
}
const TBL_COLS = {};
function tblColMenu(e, key) {
  const cols = (TBL_COLS[key] || []).filter(c => !c.when || c.when());
  const p = tblPrefs(key);
  p.hidden = p.hidden || {};
  uiMenu(e, [{ header: t('tbl.columns', 'Columns') }].concat(cols.map(c => ({
    label: (c.fixed || !p.hidden[c.id] ? '\u2713 ' : '\u2003 ') + c.label, disabled: !!c.fixed,
    fn: () => { p.hidden[c.id] = !p.hidden[c.id]; tblSave(key, p); if (TBL_REDRAW[key]) TBL_REDRAW[key](); }
  }))).concat(['-', { label: t('tbl.reset', 'Reset columns'), fn: () => { tblSave(key, {}); if (TBL_REDRAW[key]) TBL_REDRAW[key](); } }]));
}
function tblResize(e, key, id) {
  e.preventDefault(); e.stopPropagation();
  const th = e.target.parentNode, tbl = th.closest('table'), col = tbl.querySelector('col[data-c="' + id + '"]');
  const x0 = e.clientX, w0 = th.offsetWidth, h = e.target;
  h.classList.add('on');
  try { h.setPointerCapture(e.pointerId); } catch (x) {}
  const move = ev => { col.style.width = Math.max(40, w0 + ev.clientX - x0) + 'px'; };
  const up = () => {
    h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
    h.classList.remove('on');
    const p = tblPrefs(key); p.w = p.w || {}; p.w[id] = parseInt(col.style.width, 10); tblSave(key, p);
  };
  h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
}

/* ── Where backups go: header chips (PC / VPS / PS5), panels, picker ── */
let pcState = null, pcStatusOk = false, pcStore = null, pcVault = null, pcMode = 'pc', pcRoute = 'ps5', pcClients = null;

async function pcRefresh() {
  try {
    const s = await lsGet('/api/backup/status');
    const pz = $('pausechip');
    if (pz) pz.style.display = s && s.ready && s.enabled === false ? '' : 'none';
    pcStatusOk = !!(s && s.ready);
    pcState = s && s.pc ? s.pc : null;
    pcStore = s && s.store ? s.store : null;
    pcVault = s && s.vault ? s.vault : null;
    const before = pcMode + pcRoute;
    pcMode = (s && s.storage_mode) || 'pc';
    pcRoute = (s && s.vps_route) || 'ps5';
    if (before !== pcMode + pcRoute && tab === 'sync') { lsLoadTitles(); lsLoadQueue(); }
    if ($('pcbody')) pcClients = await lsGet('/api/pc/clients').catch(() => null);
  } catch (e) { pcStatusOk = false; pcState = null; }
  pcRenderChip();
  if ($('pcbody')) pcRenderPanel();
  if ($('vpsbody')) vpsRenderPanel();
}

/* Is d ('pc' | 'vps' | 'ps5') a destination of the current mode? */
function destHas(d) {
  if (d === 'pc') return pcMode === 'pc' || pcMode === 'both';
  if (d === 'vps') return pcMode === 'vps' || pcMode === 'both';
  return pcMode === 'ps5';
}
function destName(mode, route) {
  return {
    ps5: t('dest.ps5', 'PS5 only'), pc: t('dest.pc', 'PC'), vps: t('dest.vps', 'VPS'),
    both: route === 'pc' ? t('dest.both_pc', 'PC and VPS (the PC uploads)') : t('dest.both_ps5', 'PC and VPS (the PS5 uploads)')

}
/* The VPS copy is uploaded by the PC ("PC and VPS", PC route). */
function vpsByPc() { return pcMode === 'both' && pcRoute === 'pc'; }

/* [css class, short text, long text] for the PC. */
function pcMood() {
  const p = pcState;
  if (!pcStatusOk) return ['off', t('pc.chip_na', 'Backups unavailable'), t('pc.na', 'Backups are not available in this Shallot session.')];
  if (!p || !p.last_seen) return ['off', t('pc.chip_setup', 'PC: set up'),
    t('pc.never', 'No PC has connected yet. Set one up below; Shallot keeps every backup until a PC has taken it.')];
  if (p.connected && p.paused) return ['busy', t('pc.chip_paused', 'PC: paused'),
    t('pc.paused', 'The PC client is paused from this page. {n} backup(s) wait on the PS5.', { n: p.backlog || 0 })];
  if (p.connected && p.backlog) return ['busy', t('pc.chip_sending', 'PC: sending {n}', { n: p.backlog }),
    t('pc.sending', '{n} backup(s) on their way to the PC.', { n: p.backlog })];
  if (p.connected) return ['ok', t('pc.chip_ok', 'PC: up to date'), t('pc.ok', 'The PC is connected and has every backup.')];
  if (p.backlog) return ['warn', t('pc.chip_waiting', 'PC offline · {n} waiting', { n: p.backlog }),
    t('pc.waiting', 'The PC is not connected. {n} backup(s) wait on the PS5 and go to the PC when it is back.', { n: p.backlog })];
  return ['warn', t('pc.chip_off', 'PC offline'), t('pc.off', 'The PC is not connected. Nothing is waiting.')];
}

/* The same for the VPS copy, whoever uploads it. */
function vpsMood() {
  if (vpsByPc()) {
    const p = pcState || {}, v = p.vault || {};
    if (!p.last_seen) return ['off', t('vps.chip_wait_pc', 'VPS: waiting for the PC'), t('vps.wait_pc', 'The PC uploads the VPS copy, and no PC has connected yet.')];
    if (!v.state || v.state === 'off') return ['warn', t('vps.chip_pc_off', 'VPS: PC not uploading'),
      t('vps.pc_off', 'The PC client has not started uploading. It needs version 2.1 or later and the cryptography package (py -m pip install cryptography); the Docker image has it.')];
    if (v.state === 'error') return ['warn', t('vps.chip_err', 'VPS: failing'), t('vps.pc_err', 'The PC cannot upload to the vault. See the PC client log.')];
    if (v.state === 'pending') return ['busy', t('vps.chip_sending', 'VPS: sending {n}', { n: v.pending }),

/* Sends a command to the PC client and follows it for a few seconds. */
async function pcCommand(what) {
  const msg = $('pcCmdMsg');
  let d;
  try { d = await lsPost('/api/pc/command?do=' + encodeURIComponent(what)); } catch (e) { d = { error: String(e) }; }
  if (d.error) { log(d.error, 'err'); return; }
  if (msg) msg.textContent = pcCmdText({ id: d.id, do: what, state: 'waiting' });
  const t0 = Date.now();
  while (Date.now() - t0 < 15000) {
    await new Promise(r => setTimeout(r, 700));
    let s = null;
    try { s = await lsGet('/api/pc/status'); } catch (e) {}
    const c = s && s.cmd;
    if (!c || c.id !== d.id) continue;
    const m2 = $('pcCmdMsg');
    if (m2) m2.textContent = pcCmdText(c);
    if (c.state === 'done' || c.state === 'failed' || c.state === 'expired') {
      log(pcCmdText(c), c.state === 'done' ? 'ok' : 'err');
      break;
    }
  }
  pcRefresh();
}

async function pcSyncNow(btn) {
  if (btn) btn.disabled = true;
  try {
    await lsPost('/api/backup/scan_changed');
    const r = await lsPost('/api/backup/kick');
    log(r && r.pc === 'notified' ? t('pc.log_notified', 'Sync started; the PC was notified')
                                  : t('pc.log_queued', 'Changed saves are being backed up; the PC collects them when it connects'), 'ok');
  } catch (e) { log(t('pc.log_fail', 'Sync request failed: ') + e, 'err'); }
  if (btn) btn.disabled = false;
  pcRefresh();
}

async function destSave(elId) {
  const d = destDraft, msg = $('destMsg_' + elId);
  if (d.storage_mode === 'vps' || d.storage_mode === 'both') {
    if (!/^http:\/\//i.test(d.vault_url || '')) {
      if (msg) { msg.textContent = t('dest.need_url', 'Enter the vault address (http://…:8091).'); msg.style.color = 'var(--er)'; }
      return;
    }
    if (!d.vault_token) {
      if (msg) { msg.textContent = t('dest.need_token', 'Enter the vault token.'); msg.style.color = 'var(--er)'; }
      return;
    }
  }
  try {
    const r = await lsPost('/api/settings/sync', JSON.stringify(d));
    if (r.error) throw new Error(r.error);
    log(t('dest.saved', 'Backups now go to: {d}', { d: destName(d.storage_mode, d.vps_route) }), 'ok');
    destDraft = null;
    lsSettingsLoaded = false;
    await pcRefresh();
    await destRender(elId);
    const m2 = $('destMsg_' + elId);
    if (m2) { m2.textContent = t('sync.saved', 'Saved.'); m2.style.color = 'var(--ok)'; }
    if ($('lsSettings')) lsLoadSettings();
    if (d.storage_mode === 'vps' || (d.storage_mode === 'both' && d.vps_route !== 'pc')) vaultTest();
  } catch (e) { if (msg) { msg.textContent = String(e.message || e); msg.style.color = 'var(--er)'; } }
}

const IS_PS5 = /PlayStation/i.test(navigator.userAgent) || /[?&]ps5=1/.test(location.search);   /* ?ps5=1: preview on a PC */
if (IS_PS5) document.documentElement.classList.add('ps5');

/* items: {label, fn, danger, disabled, hint} | '-' (separator) | {header} */
function uiMenu(e, items) {
  e.preventDefault(); e.stopPropagation();
  closeCtxMenu();
  const m = document.createElement('div');
  m.className = 'ctx-menu' + (IS_PS5 ? ' sheet' : '');
  m.id = 'ctxmenu';
  items.filter(Boolean).forEach(it => {
    const d = document.createElement('div');
    if (it === '-') { d.className = 'sep'; m.appendChild(d); return; }
    if (it.header) { d.className = 'hdr'; d.textContent = it.header; m.appendChild(d); return; }
    d.textContent = it.label;
    if (it.hint) d.title = it.hint;
    if (it.disabled) d.className = 'off';
    else {
      if (it.danger) d.className = 'ctx-del';
      d.onclick = ev => { ev.stopPropagation(); closeCtxMenu(); it.fn(); };
    }
    m.appendChild(d);
  });
  if (IS_PS5) {
    const bg = document.createElement('div');
    bg.className = 'sheet-bg'; bg.id = 'ctxsheetbg';
    bg.onclick = closeCtxMenu;
    document.body.appendChild(bg);
  }
  document.body.appendChild(m);
  if (IS_PS5) return;
  let x = e.clientX, y = e.clientY;
  const btn = e.type === 'click' && e.currentTarget && e.currentTarget.getBoundingClientRect ? e.currentTarget : null;
  if (btn) { const r = btn.getBoundingClientRect(); x = r.right - m.offsetWidth; y = r.bottom + 4; }
  m.style.left = Math.max(4, Math.min(x, window.innerWidth - m.offsetWidth - 4)) + 'px';
  m.style.top = Math.max(4, Math.min(y, window.innerHeight - m.offsetHeight - 4)) + 'px';
}

let gpTid = null, gpView = 'game', gpData = null, gpOpen = null, gpPanel = '', gpSnaps = null, gpTimer = null;

const GP_REASON = {
  game_close: 'after playing', close_followup: 'after playing', manual_changed: 'backed up by hand',
  manual_object: 'backed up by hand', manual: 'backed up by hand', startup_reconcile: 'at start-up',
  startup_protect: 'at start-up', idle_sweep: 'background check', restored: 'after a restore',
  pre_restore: 'before a restore', pre_delete: 'before deleting a save', deleted: 'after deleting a save',
  migrated: 'earlier backup', simulated_regression: 'test', power_off: 'at power-off'
};
function gpReason(r) { return t('gp.reason.' + r, GP_REASON[r] || (r || '').replace(/_/g, ' ')); }
function gpWhen(ts) {
  if (!ts) return '\u2014';
  const d = new Date(ts * 1000), now = new Date();
  const same = d.toDateString() === now.toDateString();
  const y = new Date(now); y.setDate(now.getDate() - 1);
  const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (same) return t('gp.today', 'Today') + ' ' + hm;
  if (d.toDateString() === y.toDateString()) return t('gp.yesterday', 'Yesterday') + ' ' + hm;
  return d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' ' + hm;
}
function gpAgo(ts) {
  if (!ts) return '';
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  if (s < 90) return t('gp.just_now', 'just now');
  if (s < 3600) return t('gp.min_ago', '{n} min ago', { n: Math.round(s / 60) });
  if (s < 86400) return t('gp.h_ago', '{n} h ago', { n: Math.round(s / 3600) });
  return t('gp.d_ago', '{n} d ago', { n: Math.round(s / 86400) });
}

async function gpLoad() {
  const tid = gpTid;
  const enc = encodeURIComponent(tid);
  const [o, ti, cmp, sn] = await Promise.all([
    lsGet('/api/backup/objects?title=' + enc),
    lsGet('/api/backup/titles').catch(() => ({})),
    lsGet('/api/backup/compare?title=' + enc).catch(() => ({})),
    lsGet('/api/backup/snapshots?title=' + enc).catch(() => ({}))]);
  if (tid !== gpTid) return null;
  gpSnaps = sn.snapshots || [];
  const title = (ti.titles || []).find(x => x.title_id === tid) || {};
  const sync = {};
  (cmp.saves || []).forEach(x => { if (x.role !== 'sce_backup') sync[(x.user_id || '') + '/' + (x.object_id || x.save_name)] = x; });
  gpData = { o, title, cmp, sync, at: Date.now() };
  return gpData;
}

function gpObjects() {
  const all = (gpData && gpData.o && gpData.o.objects) || [];
  const mine = all.filter(x => !curUid || x.user_id === curUid);
  return mine.length ? mine : all;
}

/* [dot class, text] for one save */
function gpStatus(x) {
  const sy = gpData.sync[x.user_id + '/' + x.id];
  if (x.state === 'missing' || x.state === 'error') return ['er', t('gp.st_problem', 'Problem: {s}', { s: x.state })];
  if (x.state === 'untracked') return ['wn', t('gp.st_never', 'Not backed up yet')];
  if (x.state === 'changed' || x.state === 'unstable') return ['wn', t('gp.st_changed', 'Changed since the last backup')];
  if (sy && sy.sync_state === 'PC_NEWER') return ['in', t('gp.st_pc_newer', 'The PC has a newer version')];
  if (sy && sy.sync_state === 'CONFLICT') return ['er', t('gp.st_conflict', 'PS5 and PC differ')];
  if (x.pending_pc) return ['in', pcState && pcState.connected ? t('gp.st_sending', 'Backed up \u00b7 sending to the PC')
                                                                 : t('gp.st_ps5', 'Backed up on the PS5 \u00b7 PC pending')];
  return ['ok', pcState && pcState.last_seen ? t('gp.st_ok', 'Backed up \u00b7 on the PC') : t('gp.st_ok_ps5', 'Backed up')];
}

function gpSummary(objs) {
  const g = gpData.title || {};
  const n = objs.length;
  const changed = objs.filter(x => ['changed', 'unstable', 'untracked'].includes(x.state)).length;
  const pend = objs.filter(x => x.pending_pc).length;
  let s = t('gp.n_saves', '{n} saves', { n });
  if (g.running) return s + ' \u00b7 ' + t('gp.running', 'the game is running \u2014 it is backed up when you close it');
  if (changed) return s + ' \u00b7 ' + t('gp.changed_n', '{n} not backed up yet', { n: changed });
  if (pend) return s + ' \u00b7 ' + t('gp.pend_n', 'all backed up \u00b7 {n} still going to the PC', { n: pend });
  return s + (g.last_backup ? ' \u00b7 ' + t('gp.all_ok', 'all backed up, last {when}', { when: gpAgo(g.last_backup) }) : '');
}

/* Versions of one save from the game's snapshots, newest first, deduplicated. */
function gpVersions(objId, x) {
  const cur = x ? ['primary', 'sce_backup'].map(r => x.files && x.files[r] ? r + ':' + x.files[r].current_gen : '').join(',') : '';
  const seen = new Map();
  (gpSnaps || []).forEach(s => {
    const o = (s.objects || []).find(y => y.id === objId && (!x || s.user_id === x.user_id));
    if (!o) return;
    const by = {};
    (o.members || []).forEach(m => { by[m.role] = m; });
    const key = ['primary', 'sce_backup'].map(r => by[r] ? r + ':' + by[r].gen_id : '').join(',');
    const ps5 = (o.members || []).every(m => m.archive_on_ps5), pc = (o.members || []).every(m => m.on_pc);
    const e = seen.get(key);
    if (!e) seen.set(key, { snap: s.snapshot_id, at: s.created_at, reason: s.reason, ps5, pc, cur: key === cur, label: o.label || '' });
    else if (s.created_at < e.at) { e.at = s.created_at; e.reason = s.reason; }
  });
  return [...seen.values()].sort((a, b) => b.at - a.at);
}

function gpGoneHtml(objs) {
  const present = new Set(objs.map(x => x.user_id + '/' + x.id));
  const gone = new Map();
  (gpSnaps || []).forEach(s => (s.objects || []).forEach(x => {
    const k = s.user_id + '/' + x.id;
    if (!present.has(k) && !gone.has(k) && (!curUid || s.user_id === curUid)) gone.set(k, { id: x.id, label: x.label, at: s.created_at, user: s.user_id });
  }));
  if (!gone.size) return '';
  let h = '<details class="gp-gone"><summary>' + esc(t('gp.deleted', 'Deleted saves you can bring back ({n})', { n: gone.size })) + '</summary><div class="gp-list">';
  gone.forEach(g => {

    const v = vers.find(z => z.ps5), pcV = vers.find(z => z.pc);
    h += '<div class="gp-row" style="cursor:default"><span class="st"></span><div class="gp-main"><div class="gp-name">' + esc(g.label || g.id) + '</div>'
      + '<div class="gp-meta">' + esc(t('gp.last_seen', 'last backed up {when}', { when: gpWhen(g.at) })) + '</div></div>'
      + (v ? '<button class="btn sec sm" data-t="' + esc(gpTid) + '" data-s="' + lsE(v.snap) + '" data-o="' + esc(g.id) + '" data-v="' + esc(gpWhen(v.at)) + '" onclick="lsRestoreObj(this)">'
            + esc(t('gp.bring_back', 'Bring back')) + '</button>'
         : (pcV ? '<button class="btn sec sm" data-s="' + lsE(pcV.snap) + '" data-o="' + esc(g.id) + '" data-v="' + esc(gpWhen(pcV.at)) + '" onclick="gpFetch(this)">'

  return h + '</div></details>';
}
