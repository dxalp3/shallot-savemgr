function gpFetchLabel() {
  return (!pcState || !pcState.connected) && pcVault && pcVault.enabled ? t('gp.fetch_vps', 'Get from VPS') : t('gp.fetch', 'Get from PC');
}
/* A version whose archives are only on the PC: ask the PC for them, then restore as usual. */
async function gpFetch(btn) {
  const snap = btn.dataset.s, obj = btn.dataset.o || '';
  if ((!pcState || !pcState.connected) && !(pcVault && pcVault.enabled)) {
    log(t('gp.fetch_no_pc', 'The PC is not connected. Start the sync client on the PC, then try again.'), 'err');
    return;
  }
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = t('gp.fetching0', 'Asking the PC\u2026');
  let d;
  try { d = await lsPost('/api/pc/fetch?snap=' + encodeURIComponent(snap) + (obj ? '&object=' + encodeURIComponent(obj) : '')); }
  catch (e) { d = { error: String(e) }; }
  let st = { state: d.state };
  const t0 = Date.now();
  while (!d.error && d.id && st.state !== 'ready' && st.state !== 'failed' && Date.now() - t0 < 180000) {
    await new Promise(r => setTimeout(r, 1000));
    try { st = await lsGet('/api/pc/fetch_status?id=' + d.id); } catch (e) {}
    btn.textContent = t('gp.fetching', 'Getting from the PC\u2026 {got}/{n}', { got: st.got || 0, n: st.n || '?' });
  }
  const err = d.error || (d.id && st.state !== 'ready' ? (st.error || t('gp.fetch_timeout', 'the PC did not answer in time')) : '');
  if (err) {
    log(t('gp.fetch_failed', 'Could not get it from the PC: {e}', { e: err }), 'err');
    btn.disabled = false; btn.textContent = label;
    return;
  }
  log(t('gp.fetched', 'That version is back on the PS5'), 'ok');
  gpData = null;
  await gpLoad();
  gpRender();
  if (obj) await lsRestoreObj(gpBtn({ t: gpTid, s: snap, o: obj, v: btn.dataset.v || '' }));
  else await lsRestoreGame(gpBtn({ t: gpTid, s: snap, n: btn.dataset.n || '', w: btn.dataset.w || '' }));
}

  if (tab === 'browse' && !(mt && gpView === 'files')) gpRender();

function gpSaveMenu(e, id) {

function lsTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts * 1000), s = Math.round(Date.now() / 1000 - ts);
  let ago;
  if (s < 60) ago = s + 's';
  else if (s < 3600) ago = Math.round(s / 60) + 'm';
  else if (s < 86400) ago = Math.round(s / 3600) + 'h';
  else ago = Math.round(s / 86400) + 'd';
  return '<span title="' + esc(d.toLocaleString()) + '">' + esc(ago) + ' ' + esc(t('sync.ago', 'ago')) + '</span>';
}
function lsE(v) { return esc(String(v == null ? '' : v)); }
async function lsGet(url) { const r = await fetch(url); return r.json(); }
async function lsPost(url, body) {
  const r = await fetch(url, { method: 'POST', body: body || '' });
  return r.json();
}

let lsLastJobActive = false;
function lsRenderJob(j) {
  const el = $('lsJob'); if (!el) return;
  if (j.active) {
    const pct = j.total ? Math.round(100 * j.done / j.total) : 0;
    el.innerHTML = '<div class="ls-dim">' + lsE(j.kind) + (j.title_id ? ' ' + lsE(j.title_id) : '') + ': ' + lsE(j.done) + ' / ' + lsE(j.total)
      + (j.current ? ' · ' + lsE(j.current) : '') + '</div>'
      + '<div class="ls-bar"><div style="width:' + pct + '%"></div></div>'
      + '<button class="ls-mini" onclick="lsCancel()">' + esc(t('common.cancel', 'Cancel')) + '</button>';
  } else if (j.status && j.status !== 'idle') {
    el.innerHTML = '<div class="ls-dim">' + esc(t('sync.last_job', 'Last job')) + ': ' + lsE(j.kind) + ' — ' + lsE(j.status) + ' · ' + lsE(j.summary) + '</div>';
  } else el.innerHTML = '';
  if (lsLastJobActive && !j.active) {     /* a job just finished: refresh results */
    lsLoadTitles(); lsLoadCatalogue(); lsLoadEvents();
    if (lsSel !== null) lsShowDetail(lsSel, lsDetailMode);
  }
  lsLastJobActive = !!j.active;
}

async function lsLoadCatalogue() {
  const el = $('lsCat'); if (!el) return;

    try {
      const d = await lsGet('/api/reconcile/catalogue/result' + (kind === 'full' ? '?kind=full' : ''));
      if (d.error) continue;
      h += '<div class="ls-catres"><b>' + esc(kind === 'full' ? t('sync.cat_full_short', 'Full catalogue') : t('sync.cat_quick_short', 'Quick catalogue')) + '</b> '
        + lsTime(d.finished_at) + (d.cancelled ? ' <span class="ls-b warn">cancelled</span>' : '') + '<br>'
        + lsE(d.checked) + '/' + lsE(d.titles) + ' ' + esc(t('sync.titles_checked', 'titles checked')) + ' · '
        + lsE((d.by_result || {}).HEALTHY || 0) + ' ' + esc(t('sync.healthy', 'healthy')) + ' · '
        + lsE(d.changed_saves) + ' ' + esc(t('sync.changed', 'changed')) + ' · '
        + lsE(d.missing_saves) + ' ' + esc(t('sync.missing', 'missing')) + ' · '
        + lsE(d.known_regressions) + ' ' + esc(t('sync.regressions', 'regressions')) + ' · '
        + lsE(d.not_scanned) + ' ' + esc(t('sync.not_scanned', 'not scanned')) + ' · '
        + lsE(d.errors) + ' ' + esc(t('sync.errors', 'errors'))
        + (d.skipped_running ? ' · ' + lsE(d.skipped_running) + ' ' + esc(t('sync.skipped_running', 'skipped (running)')) : '')
        + (d.protect_jobs_queued ? ' · ' + lsE(d.protect_jobs_queued) + ' ' + esc(t('sync.protect_jobs', 'backup jobs queued')) : '');
      (d.anomalous_titles || []).forEach(a => {
        h += '<div class="ls-anom" onclick="lsShowDetail(\'' + lsE(a.title_id) + '\',\'report\')">' + lsBadge(a.result) + ' '

  el.innerHTML = h;
}

async function lsLoadQueue() {
  const el = $('lsQueue'); if (!el) return;
  try {
    const d = await lsGet('/api/backup/queue');
    const q = (d.queue || []).slice().reverse();
    const live = x => x.state === 'ready' || x.state === 'packed';
    const parts = [];
    if (destHas('pc')) parts.push(lsE(q.filter(x => live(x) && !x.lan_ack_at).length) + ' ' + esc(t('sync.waiting_pc', 'waiting for the PC')));
    if (destHas('vps')) parts.push(lsE(q.filter(x => live(x) && !x.vault_ack_at).length) + ' ' + esc(t('sync.waiting_vps', 'waiting for the VPS')));
    parts.push(lsE(q.length) + ' ' + esc(t('sync.total', 'total')));
    el.innerHTML = '<div class="ls-dim" style="margin-bottom:6px">' + parts.join(', ') + '</div>'
      + (q.length ? lsQueueTable(q.slice(0, 25), 'queue', lsLoadQueue) : '');

}

async function lsSaveSettings() {
  const body = {};
  document.querySelectorAll('[id^="lsc_"]').forEach(i => {
    const k = i.id.slice(4);
    body[k] = i.type === 'checkbox' ? i.checked : i.type === 'number' ? parseInt(i.value, 10) : i.value;
  });
  const msg = $('lsSetMsg');
  try {
    const d = await lsPost('/api/settings/sync', JSON.stringify(body));
    if (d.error) { msg.textContent = d.error; msg.style.color = 'var(--er)'; return; }
    lsSettingsLoaded = false;
    await lsLoadSettings();               /* re-renders the form with the stored values */
    const m2 = $('lsSetMsg');
    if (m2) { m2.textContent = t('sync.saved', 'Saved.'); m2.style.color = 'var(--ok)'; }
    lsRefreshStatus();
    log(t('sync.saved_log', 'Backup & Sync settings saved'), 'ok');
  } catch (e) { msg.textContent = String(e); msg.style.color = 'var(--er)'; }
}

async function lsAct(promise, okMsg) {
  try {
    const d = await promise;
    if (d.error) { log(d.error, 'er'); return null; }
    if (okMsg) log(okMsg, 'ok');
    return d;
  } catch (e) { log(String(e), 'er'); return null; }
}
/* Queues the scan, then waits until it really finished (it may queue behind
 * backup jobs) and reports the outcome, also when nothing changed. */
let lsScanBusy = false;
async function lsScanNow() {
  if (lsScanBusy) return;
  const msg = (txt, col) => { const m = $('lsScanMsg'); if (m) { m.textContent = txt; m.style.color = col || ''; } };
  let prev = 0;
  try { prev = (await lsGet('/api/backup/status')).last_idle_scan || 0; } catch (e) {}
  const d = await lsAct(lsPost('/api/backup/scan_changed'));
  if (!d) return;
  lsScanBusy = true;
  msg(t('sync.scanning', 'Scanning… (waits for running backup jobs first)'));
  const t0 = Date.now();
  while (Date.now() - t0 < 180000) {
    await new Promise(r => setTimeout(r, 1500));
    let s;
    try { s = await lsGet('/api/backup/status'); } catch (e) { continue; }
    if ((s.last_idle_scan || 0) > prev) {
      let res = t('sync.scan_done', 'Scan finished');
      try {
        const ev = (await lsGet('/api/backup/events?limit=40')).events || [];
        const c = ev.find(e => e.code === 'IDLE_SCAN_CHANGED_COUNT' && e.ts >= s.last_idle_scan - 5);
        if (c) {
          const m = /(\d+) changed, (\d+) new save\(s\); (\d+) title/.exec(c.detail || '');
          if (m && m[1] === '0' && m[2] === '0')
            res = t('sync.scan_nothing', 'Scan finished: nothing changed, nothing to back up');
          else if (m)
            res = t('sync.scan_found', 'Scan finished') + ': ' + m[1] + ' ' + t('sync.changed', 'changed') + ', ' + m[2] + ' '
                + t('sync.new', 'new') + ' → ' + t('sync.backups_for', 'backups queued for') + ' ' + m[3] + ' '
                + t('sync.games_lc', 'game(s)');
        }
      } catch (e) {}
      msg(res, 'var(--ok)');
      log(res, 'ok');
      lsBusyDone();
      return;
    }
    msg(t('sync.scanning_wait', 'Scanning…') + ' ' + Math.round((Date.now() - t0) / 1000) + 's'
        + (s.worker && s.worker.current ? ' (' + t('sync.worker_busy', 'worker busy') + ': ' + s.worker.current + ')' : ''));
  }
  msg(t('sync.scan_slow', 'Scan still queued after 3 min; check Recent events later'), '#ffb020');
  lsBusyDone();
}

/* Posts a restore request, offers unmount+retry, follows it to the end and logs per-file results. */
async function lsRestoreRun(url, label, msg, isDelete) {
  if (lsRestoreBusy) return;
  if (!confirm(msg)) return;
  const mountedMsg = t('sync.unmount_retry', 'A save is open (mounted) in the Browse tab. Unmount it now and retry the restore?\n\nUnmounting writes any edits back first, exactly like the Browse tab does.');
  let d;
  try { d = await lsPost(url); } catch (e) { log(String(e), 'er'); return; }
  if (d.error && /mounted/.test(d.error) && confirm(mountedMsg)) {
    try { await fetch('/api/unmount'); mt = false; renderTB(); } catch (e) {}
    try { d = await lsPost(url); } catch (e) { log(String(e), 'er'); return; }
  }
  if (d.error) { log(label + ': ' + d.error, 'er'); return; }
  lsRestoreBusy = true;
  log(label + ': ' + (isDelete ? t('sync.delete_started', 'delete started') : t('sync.restore_started', 'restore started')), '');
  const t0 = Date.now();
  let last = '';
  while (Date.now() - t0 < 600000) {
    await new Promise(r => setTimeout(r, 1500));
    let rs;
    try { rs = (await lsGet('/api/restore/status')).restore || {}; } catch (e) { continue; }
    if (rs.active) {
      if (rs.step && rs.step !== last) { last = rs.step; log(label + ': ' + rs.step + '\u2026'); }
      continue;
    }
    if (rs.state === 'done') log(label + ': ' + (isDelete ? t('sync.delete_done', 'done') : t('sync.restore_done', 'restored')) + ' \u2014 ' + rs.message, 'ok');
    else log(label + ': ' + (rs.state === 'partial' ? t('sync.restore_partial', 'restore INCOMPLETE') : t('sync.restore_failed', 'restore failed')) + ' \u2014 ' + rs.message, 'er');
    (rs.items || []).forEach(it => {
      if (['failed', 'undone', 'undo_failed', 'skipped', 'removed'].includes(it.result))
        log('  ' + it.save_name + ': ' + it.result + (it.note ? ' \u2014 ' + it.note : ''), it.result === 'skipped' || it.result === 'undone' || it.result === 'removed' ? '' : 'er');
    });
    break;
  }
  lsRestoreBusy = false;
  lsRefreshStatus(); lsLoadTitles(); lsLoadEvents();
  if (lsSel !== null) lsShowDetail(lsSel, lsDetailMode);
  if (tab === 'browse' && gpTid) { gpData = null; await load(); renderCt(); }
}

  cols.rowMenu = x => '<button class="iconbtn" data-t="' + lsE(tid) + '" data-o="' + lsE(x.id) + '" data-u="' + lsE(x.user_id) + '" data-f="'
    + filesOf(x).map(m => lsE(m.save_name)).join(', ') + '" onclick="event.stopPropagation();lsObjMenu(event,this)">\u22ef</button>';
  h += uiTable('objects', cols, o, x => ' class="click" data-t="' + lsE(tid) + '" data-o="' + lsE(x.id) + '" onclick="lsShowObj(this)" oncontextmenu="lsObjMenu(event,this)"',
    () => lsShowDetail(tid, 'objects'));
  return h + goneHtml;
}

function lsSnapRestoreBtn(tid, s, label) {
  const when = new Date((s.created_at || 0) * 1000).toLocaleString();
  if (!s.restorable_on_ps5)
    return '<span class="ls-dim" title="' + esc(t('sync.snap_pc_hint', 'Some files of this snapshot are only on the PC now.')) + '">'
      + esc(t('sync.snap_not_on_ps5', 'archives no longer on the PS5')) + '</span>';
  return '<button class="ls-mini" style="border-color:#5a4210;color:#ffb020" data-t="' + lsE(tid) + '" data-s="' + lsE(s.snapshot_id)
    + '" data-n="' + lsE(s.object_count) + '" data-w="' + lsE(when) + '" onclick="lsRestoreGame(this)">' + esc(label) + '</button>';
}

async function lsSnapshotsView(tid) {
  const d = await lsGet('/api/backup/snapshots?title=' + encodeURIComponent(tid));
  if (d.error) return '<span style="color:var(--er)">' + lsE(d.error) + '</span>';
  const all = d.snapshots || [];
  const games = all.filter(s => s.kind === 'title');
  let h = '<div class="ls-dim" style="margin-bottom:6px">' + esc(t('sync.snap_hint',
    'A game snapshot holds every save of the game as it was at one moment. Restoring one replaces the saves it contains (the current ones are backed up first) and leaves saves that are not in it alone; nothing is deleted.')) + '</div>';
  if (!games.length) return h + '<div class="ls-dim">' + esc(t('sync.no_snapshots', 'No game snapshot yet. Use Back Up Entire Game.')) + '</div>';
  h += '<table class="ls-tbl"><tr><th>#</th><th>' + esc(t('sync.created', 'Created')) + '</th><th>' + esc(t('sync.reason', 'Reason')) + '</th><th>'
    + esc(t('sync.saves', 'Saves')) + '</th><th>PC</th><th></th></tr>';
  games.forEach((s, i) => {
    const ids = (s.objects || []).map(o => lsE(o.id) + ((o.members || []).length > 1 ? '<span class="ls-dim">+bu</span>' : '')).join(', ');
    h += '<tr' + (i === 0 ? ' class="cur"' : '') + '><td>' + lsE(s.snapshot_id) + (i === 0 ? ' <span class="ls-b ok">' + esc(t('sync.latest', 'latest')) + '</span>' : '') + '</td>'
      + '<td>' + lsTime(s.created_at) + '</td><td>' + lsE(s.reason) + '</td>'
      + '<td>' + lsE(s.object_count) + ' <span class="ls-dim">(' + lsE(s.file_count) + ' ' + esc(t('sync.files', 'files')) + ')</span><br><span class="ls-dim">' + ids + '</span></td>'
      + '<td>' + (s.all_on_pc ? '<span class="ls-b ok">\u2713</span>' : '<span class="ls-b warn">' + esc(t('sync.waiting_pc_badge', 'waiting for PC')) + '</span>') + '</td>'
      + '<td>' + lsSnapRestoreBtn(tid, s, t('sync.restore_game_here', 'Restore entire game to this point')) + '</td></tr>';
  });
  return h + '</table>';
}

async function lsObjectVersionsView(tid, obj) {
  const [d, cur] = await Promise.all([lsGet('/api/backup/snapshots?title=' + encodeURIComponent(tid)),
                                      lsGet('/api/backup/objects?title=' + encodeURIComponent(tid))]);
  if (d.error) return '<span style="color:var(--er)">' + lsE(d.error) + '</span>';
  const co = (cur.objects || []).find(x => x.id === obj) || { files: {} };
  const curKey = ['primary', 'sce_backup'].map(r => co.files[r] ? r + ':' + co.files[r].current_gen : '').join(',');
  const seen = new Map();
  (d.snapshots || []).forEach(s => {
    const o = (s.objects || []).find(x => x.id === obj);
    if (!o) return;
    const by = {};
    (o.members || []).forEach(m => { by[m.role] = m; });
    const key = ['primary', 'sce_backup'].map(r => by[r] ? r + ':' + by[r].gen_id : '').join(',');
    const ps5 = (o.members || []).every(m => m.archive_on_ps5), pc = (o.members || []).every(m => m.on_pc);
    const e = seen.get(key);
    if (!e) seen.set(key, { snap: s.snapshot_id, first: s.created_at, reason: s.reason, by, ps5, pc });
    else if (s.created_at < e.first) { e.first = s.created_at; e.reason = s.reason; }
  });
  let h = '<div class="ls-acts"><button class="ls-mini" data-t="' + lsE(tid) + '" data-o="' + lsE(obj) + '" onclick="lsProtectObj(this)">'
    + esc(t('sync.backup_obj', 'Back Up This Save')) + '</button><span class="ls-dim">'
    + esc(t('sync.obj_ver_hint', 'Restoring a version puts back the save file and its PS5 backup copy together; other saves of the game are not touched.')) + '</span></div>';
  if (!seen.size) return h + '<div class="ls-dim">' + esc(t('sync.no_obj_versions', 'No snapshot holds this save yet. Use Back Up This Save.')) + '</div>';
  h += '<table class="ls-tbl"><tr><th>' + esc(t('sync.version', 'Version')) + '</th><th>' + esc(t('sync.first_seen', 'Captured')) + '</th><th>'
    + esc(t('sync.reason', 'Reason')) + '</th><th>PS5</th><th>PC</th><th></th></tr>';
  [...seen.entries()].forEach(([key, e]) => {
    const isCur = key === curKey;
    const ver = ['primary', 'sce_backup'].filter(r => e.by[r]).map(r => (r === 'primary' ? t('sync.f_primary', 'save file') : t('sync.f_backup', 'PS5 backup copy')) + ' gen ' + e.by[r].gen_id).join(', ');
    const sha = (e.by.primary || e.by.sce_backup || {}).sha256 || '';
    h += '<tr' + (isCur ? ' class="cur"' : '') + '><td>' + esc(ver) + (isCur ? ' <span class="ls-b ok">' + esc(t('sync.current', 'current')) + '</span>' : '')
      + '<br><span class="ls-dim" style="font-family:monospace">' + lsE(sha.slice(0, 12)) + '</span></td>'
      + '<td>' + lsTime(e.first) + '</td><td>' + lsE(e.reason) + '</td>'
      + '<td>' + (e.ps5 ? '\u2713' : '<span class="ls-dim">\u2014</span>') + '</td>'
      + '<td>' + (e.pc ? '\u2713' : '<span class="ls-b warn">' + esc(t('sync.waiting_pc_badge', 'waiting for PC')) + '</span>') + '</td><td>'
      + (isCur ? '' : e.ps5 ? '<button class="ls-mini" style="border-color:#5a4210;color:#ffb020" data-t="' + lsE(tid) + '" data-s="' + lsE(e.snap)
          + '" data-o="' + lsE(obj) + '" data-v="' + lsE(ver) + '" onclick="lsRestoreObj(this)">' + esc(t('sync.restore_obj_here', 'Restore this save to this version')) + '</button>'
        : '<span class="ls-dim">' + esc(t('sync.snap_not_on_ps5', 'archives no longer on the PS5')) + '</span>')
      + '</td></tr>';
  });
  return h + '</table>';
}

/* ── Init ──────────────────────────────────────────── */
async function init() {
  applyLanguage();
  if (window.innerWidth <= 768) $('drawer').classList.add('collapsed');
  else drawerOpen = true;
  updateDrawer();
  await loadUsers();
  await load();
  navRestore();
  setInterval(() => {
    if (tab !== 'settings') return;
    refreshAutoStatus();
    drainDriveQueue(false);
  }, 15000);
  renderCt();
  renderTB();
}

init();
</script>
