<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ShallotMgr</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box }

    :root {
      --bg: #06060e; --s1: #0c0c1a; --bd: #1a1a35;
      --ac: #0070ff; --ac2: #00bbff; --gl: rgba(0,112,255,.15);
      --tx: #d0d0e4; --dm: #505068;
      --ok: #00dd77; --er: #ff2244; --lb: #040408;
    }

    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: radial-gradient(ellipse at 10% 40%, #0c1424, var(--bg) 65%);
      color: var(--tx); height: 100vh;
      display: flex; flex-direction: column; overflow: hidden;
    }

    ::-webkit-scrollbar { width: 5px }
    ::-webkit-scrollbar-track { background: transparent }
    ::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 3px }

    /* ── Nav ─────────────────────────────────────────── */
    nav {
      height: 48px; background: var(--s1);
      border-bottom: 1px solid var(--bd);
      display: flex; align-items: center;
      padding: 0 20px; gap: 6px;
      flex-shrink: 0; position: relative;
    }
    nav::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--ac), transparent); opacity: .3;
    }

    .logo {
      font-size: 14px; font-weight: 800; letter-spacing: 3px;
      text-transform: uppercase; margin-right: 20px;
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .tab {
      background: none; border: 1px solid transparent; color: var(--dm);
      font-size: 11px; font-weight: 600; padding: 5px 14px;
      cursor: pointer; border-radius: 16px; transition: all .2s;
      letter-spacing: .5px; text-transform: uppercase;
    }
    .tab:hover { color: var(--tx); border-color: var(--bd) }
    .tab.active {
      color: #fff; background: var(--ac); border-color: var(--ac);
      box-shadow: 0 0 12px var(--gl);
    }

    .spacer { flex: 1 }

    .shut {
      background: none; border: 1px solid var(--er); color: var(--er);
      padding: 5px 12px; border-radius: 16px; cursor: pointer;
      font-size: 10px; font-weight: 700;
      letter-spacing: .5px; text-transform: uppercase; transition: all .2s;
    }
    .shut:hover { background: var(--er); color: #fff }

    /* PC link chip (header) + panel */
    .pcchip {
      display: inline-flex; align-items: center; gap: 6px; background: none; color: var(--tx);
      border: 1px solid var(--bd); padding: 5px 12px; border-radius: 16px; cursor: pointer;
      font-size: 11px; font-weight: 600; margin-right: 8px; white-space: nowrap;
    }
    .pcchip:hover { border-color: var(--ac) }
    .pcdot { width: 9px; height: 9px; border-radius: 50%; background: var(--dm); flex: none }
    .pcdot.ok { background: #4caf50 } .pcdot.busy { background: #ffb300 } .pcdot.warn { background: #ff7043 }
    .pcdot.off { background: var(--dm) }
    .modal.pcm { max-width: 560px; max-height: 88vh; overflow-y: auto }
    .pcm .pcrow { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding: 4px 0;
                  border-bottom: 1px solid rgba(26,26,53,.5) }
    .pcm .pcrow span:first-child { color: var(--dm) }
    .pcm ol { font-size: 12px; padding-left: 18px; margin: 8px 0 }
    .pcm ol li { margin-bottom: 10px; line-height: 1.5 }
    .pcm code { display: block; background: var(--bg); border: 1px solid var(--bd); border-radius: 6px;
                padding: 6px 8px; margin-top: 4px; font-size: 11px; user-select: all; word-break: break-all }
    .pcm a.dl { color: var(--ac2); font-weight: 700; margin-right: 12px }
    .pcm .pcbtns { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px }
    .pcm .pcbtns button { padding: 8px 16px; border-radius: 16px; border: 1px solid var(--ac); background: var(--ac);
                          color: #fff; font-size: 11px; font-weight: 700; cursor: pointer }
    .pcm .pcbtns button.sec { background: none; color: var(--tx); border-color: var(--bd) }
    .pcm details summary { cursor: pointer; font-size: 13px; font-weight: 700; margin-top: 12px }
    /* Where backups go: four choices */
    .dests { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
    @media (max-width: 560px) { .dests { grid-template-columns: 1fr } }
    .dest { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--bd); border-radius: 10px;
            padding: 10px 12px; cursor: pointer; font-size: 12px; background: var(--bg) }
    .dest input { position: absolute; opacity: 0; pointer-events: none }
    .dest b { font-size: 13px; color: var(--tx) }
    .dest span { color: var(--dm); line-height: 1.45 }
    .dest:hover { border-color: var(--ac) }
    .dest.on { border-color: var(--ac); box-shadow: inset 0 0 0 1px var(--ac) }
    .destsub { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12px }
    .destsub label { display: flex; gap: 6px; align-items: flex-start; line-height: 1.45 }
    .destq { font-weight: 700; color: var(--tx) }
    .destsub label.destf { flex-direction: column; gap: 4px; color: var(--dm); font-size: 11px }
    .destf input { background: var(--bg); border: 1px solid var(--bd); color: var(--tx); padding: 7px 9px; border-radius: 8px;
                   font-family: monospace; font-size: 12px; width: 100% }
    .destsub a, .pcm a:not(.dl), .ls-set a { color: var(--ac2) }
    .ui-tbl { table-layout: fixed }
    .ui-tbl th { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .ui-tbl td { overflow: hidden; text-overflow: ellipsis }
    .ui-tbl .col-rs { position: absolute; top: 0; right: 0; width: 9px; height: 100%; cursor: col-resize; user-select: none; touch-action: none }
    .ui-tbl .col-rs:hover, .ui-tbl .col-rs.on { background: var(--ac); opacity: .5 }
    .ui-tbl th.col-menu { text-align: right; overflow: visible }
    .ls-kv tr.click { cursor: pointer }
    .ls-kv tr.click:hover td { background: var(--s2) }
    .ls-kv tr.click td:first-child::after { content: ' \203a'; color: var(--dm) }
    /* Clickable tiles: cards fold by their header; anything clickable shows it on hover.
       Only colours change (cheap on the PS5 browser); the shadow is skipped there. */
    [onclick]:not(button):not(input):not(select):not(label) { cursor: pointer }
    .ls-card { transition: border-color .15s, background-color .15s }
    .ls-card:hover { border-color: rgba(120,140,255,.4); box-shadow: 0 2px 14px rgba(0,0,0,.25) }
    html.ps5 .ls-card:hover { box-shadow: none }
    .ls-card > .ls-h { cursor: pointer; border-radius: 6px; margin: -4px -6px 6px; padding: 4px 6px; transition: background-color .15s }
    .ls-card > .ls-h:hover { background: var(--s2) }
    .ls-card > .ls-h::before { content: '\25be'; color: var(--dm); font-size: 12px; display: inline-block; width: 12px; transition: transform .15s }
    html.ps5 .ls-card > .ls-h::before { transition: none }
    .ls-card.folded > .ls-h { margin-bottom: -4px }
    .ls-card.folded > .ls-h::before { transform: rotate(-90deg) }
    .ls-card.folded > :not(.ls-h) { display: none }
    .pccl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid rgba(26,26,53,.5); font-size: 12px }
    .pccl .grow { flex: 1; min-width: 150px }
    .pccl button { padding: 4px 10px; border-radius: 12px; border: 1px solid var(--bd); background: none; color: var(--tx); font-size: 11px; cursor: pointer }
    .set-page { padding: 18px; max-width: 760px; width: 100% }
    .set-page > .ls-card { margin-bottom: 14px; padding: 16px }
    .set-intro { color: var(--dm); font-size: 12px; margin: 0 0 12px; line-height: 1.5 }
    .tool { display: flex; flex-direction: column; align-items: stretch; gap: 14px; width: 100%; max-width: 560px; padding: 18px }
    .tool-h { display: flex; align-items: center; font-size: 18px; font-weight: 800; color: var(--tx) }
    .tool-sub { color: var(--dm); font-size: 12px; line-height: 1.5; margin-top: -6px }
    .tool .drop { max-width: none; width: auto }
    .tool-opt { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; font-size: 12px; color: var(--dm) }
    .tool-opt input[type=text] { background: var(--bg); border: 1px solid var(--bd); color: var(--tx); padding: 6px 10px; border-radius: 8px;
                                 font-family: monospace; font-size: 13px; width: 200px }
    .drop.tile { cursor: pointer; transition: border-color .15s, background-color .15s }
    .drop.tile:hover, .drop.tile:focus-visible { border-color: var(--ac); background: rgba(0,112,255,.05); outline: none }
    html.ps5 .drop.tile { transition: none }
    .qhelp { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; padding: 0;
             margin-left: 6px; border-radius: 50%; border: 1px solid var(--bd); background: none; color: var(--dm);
             font-size: 10px; font-weight: 700; cursor: pointer; vertical-align: middle; flex: none; line-height: 1 }
    .qhelp:hover { color: var(--tx); border-color: var(--ac) }
    .helppop { position: fixed; z-index: 1000; max-width: 340px; background: var(--s2, var(--s1)); color: var(--tx);
               border: 1px solid var(--bd); border-radius: 10px; padding: 12px 14px; font-size: 12px; line-height: 1.55;
               box-shadow: 0 8px 28px rgba(0,0,0,.45) }
    .helppop b { display: block; font-size: 13px; margin-bottom: 4px }
    details.legacy > summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--tx); padding: 4px 0 }

    /* ── Layout ──────────────────────────────────────── */
    .main { flex: 1; display: flex; overflow: hidden }
    .main.full .left { display: none }
    .main.full .right { border-left: none }

    .left {
      width: 300px; min-width: 220px; display: flex; flex-direction: column;
      border-right: 1px solid var(--bd); background: var(--s1);
    }

    .shdr {
      padding: 10px 16px; font-size: 10px; font-weight: 700; color: var(--dm);
      text-transform: uppercase; letter-spacing: 1.5px;
      border-bottom: 1px solid var(--bd); flex-shrink: 0;
    }
    .desk-shdr { display: flex; align-items: center; gap: 0 }

    /* ── Platform tabs ────────────────────────────────── */
    .ptab {
      background: none; border: 1px solid var(--bd); color: var(--dm);
      font-size: 13px; font-weight: 700; padding: 3px 12px;
      cursor: pointer; letter-spacing: .5px; text-transform: uppercase; transition: all .2s;
    }
    .ptab:first-of-type { border-radius: 10px 0 0 10px }
    .ptab:last-of-type { border-radius: 0 10px 10px 0 }
    .ptab.active { color: #fff; background: var(--ac); border-color: var(--ac) }
    .ptab:hover:not(.active) { color: var(--tx) }

    /* ── Save list ───────────────────────────────────── */
    .svs { flex: 1; overflow-y: auto }

    .sv {
      padding: 10px 14px; border-bottom: 1px solid rgba(26,26,53,.5);
      cursor: pointer; transition: all .15s; border-left: 2px solid transparent;
    }
    .sv:hover { background: rgba(255,255,255,.02) }
    .sv.sel {
      background: rgba(0,112,255,.08); border-left-color: var(--ac);
      box-shadow: inset 3px 0 8px -3px var(--gl);
    }
    .sv .tid { font-size: 12px; font-weight: 600; color: var(--tx); letter-spacing: .3px }
    .sv .sn {
      font-size: 11px; color: var(--dm); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .badge { display:inline-block; font-size:9px; font-weight:700; padding:1px 5px; border-radius:3px; float:right; margin-left:6px }
    .badge-ps4 { background:#1e6fbf; color:#fff }
    .badge-ps5 { background:#1a8a3f; color:#fff }
    .badge-bu { background:#c89b00; color:#000 }
    .badge-usb { background:#8b5cf6; color:#fff }

    .bulk-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
      padding: 8px 10px; border-bottom: 1px solid var(--bd);
      background: var(--s1); flex-shrink: 0;
    }
    .bulk-bar .bulk-all {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 700; color: var(--dm);
      text-transform: uppercase; letter-spacing: .4px; cursor: pointer;
    }
    .bulk-bar .bulk-count { font-size: 10px; color: var(--dm); min-width: 72px }
    .bulk-bar .bulk-btn {
      background: var(--bd); border: none; color: var(--tx);
      font-size: 9px; font-weight: 700; padding: 5px 8px; border-radius: 10px;
      cursor: pointer; letter-spacing: .3px; text-transform: uppercase;
    }
    .bulk-bar .bulk-btn:hover:not(:disabled) { background: var(--gl); color: #fff }
    .bulk-bar .bulk-btn:disabled { opacity: .35; cursor: default }
    .bulk-bar .bulk-btn.grn { background: rgba(0,180,90,.25); color: #6f6 }
    .sv .bulk-cb {
      margin: 0 8px 0 0; accent-color: var(--ac); width: 14px; height: 14px;
      vertical-align: middle; flex-shrink: 0;
    }
    .sv .sv-row { display: flex; align-items: flex-start; }
    .sv .sv-body { flex: 1; min-width: 0 }

    /* ── Right panel ─────────────────────────────────── */
    .right { flex: 1; display: flex; flex-direction: column; overflow: hidden }

    .tb {
      padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      border-bottom: 1px solid var(--bd); background: var(--s1);
      flex-shrink: 0; min-height: 40px;
    }

    .btn {
      background: var(--ac); color: #fff; border: none;
      padding: 6px 16px; border-radius: 16px; cursor: pointer;
      font-size: 11px; font-weight: 700; letter-spacing: .4px;
      text-transform: uppercase; transition: all .2s;
    }
    .btn:hover { box-shadow: 0 0 12px var(--gl); filter: brightness(1.1) }
    .btn:disabled { opacity: .25; cursor: not-allowed; box-shadow: none; filter: none }
    .btn.red { background: var(--er) }
    .btn.grn { background: var(--ok); color: #000 }

    /* ── Content area ────────────────────────────────── */
    .ct { flex: 1; overflow-y: auto; display: flex; flex-direction: column }
    .ct.ctr { align-items: center; justify-content: center }

    .drop {
      border: 2px dashed var(--bd); border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 48px; transition: all .2s; gap: 10px;
      max-width: 380px; width: 90%;
    }
    .drop.over { border-color: var(--ac); background: rgba(0,112,255,.06) }

    .dico { font-size: 32px; opacity: .5 }
    .dlbl { color: var(--dm); font-size: 12px; text-align: center; line-height: 1.6 }
    .dlbl b { color: var(--tx) }

    .bbtn {
      background: var(--ac); color: #fff; border: none;
      padding: 8px 24px; border-radius: 16px; cursor: pointer;
      font-size: 11px; font-weight: 700; letter-spacing: .4px;
      text-transform: uppercase; transition: all .2s; margin-top: 4px;
    }
    .bbtn:hover { box-shadow: 0 0 12px var(--gl); filter: brightness(1.1) }

    .dlnk {
      display: inline-block; padding: 10px 24px;
      background: var(--ok); color: #000; border-radius: 16px;
      text-decoration: none; font-weight: 700; font-size: 12px;
      letter-spacing: .4px; text-transform: uppercase;
      transition: all .2s; margin-top: 8px;
    }
    .dlnk:hover { filter: brightness(1.1); box-shadow: 0 0 12px rgba(0,221,119,.3) }

    /* ── File listing ────────────────────────────────── */
    .fi { padding: 6px 16px; font-size: 14px; color: var(--tx); display: flex; align-items: center }
    .fi.dir { color: var(--ac2); font-weight: 600; cursor: pointer }
    .fi .sz { color: var(--dm); font-size: 12px; margin-left: auto }
    .dir-dots {
      color: var(--dm); font-size: 18px;
      cursor: pointer; padding: 0 4px; margin-left: 6px;
      opacity: .3; transition: opacity .15s; border-radius: 4px;
    }
    .fi.dir:hover .dir-dots { opacity: .7 }
    .dir-dots:hover { opacity: 1 !important; color: var(--tx); background: rgba(255,255,255,.05) }
    .title-dots {
      color: var(--dm); font-size: 18px;
      cursor: pointer; padding: 0 4px; margin-left: 6px;
      opacity: .7; transition: opacity .15s; border-radius: 4px;
    }
    .sv:hover .title-dots { opacity: .9 }
    .title-dots:hover { opacity: 1 !important; color: var(--tx); background: rgba(255,255,255,.05) }

    .empty { padding: 40px; text-align: center; color: var(--dm); font-size: 12px; letter-spacing: .3px }
    .dh { padding: 16px; text-align: center; color: var(--dm); font-size: 11px; opacity: .4; margin-top: auto }

    /* ── Log panel ───────────────────────────────────── */
    .logw {
      height: 150px; border-top: 1px solid var(--bd);
      display: flex; flex-direction: column;
      flex-shrink: 0; background: var(--lb); position: relative;
    }
    .logw::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,20,10,.04) 2px, rgba(0,20,10,.04) 4px);
      pointer-events: none; z-index: 1;
    }

    .log {
      flex: 1; overflow-y: auto; padding: 6px 14px;
      font-family: 'SF Mono', Consolas, monospace; font-size: 11px; line-height: 1.7;
    }

    .ll { color: #4a6a5a; animation: fadeIn .2s ease }
    .ll.err { color: var(--er) }
    .ll.ok { color: var(--ok) }
    .ll .t { opacity: .35; margin-right: 8px }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(2px) }
      to { opacity: 1; transform: none }
    }

    /* ── Modal ───────────────────────────────────────── */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; backdrop-filter: blur(4px);
    }
    .modal {
      background: var(--s1); border: 1px solid var(--bd); border-radius: 12px;
      padding: 24px; max-width: 380px; width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
    }
    .modal h3 { font-size: 14px; color: var(--tx); margin-bottom: 8px }
    .modal p { font-size: 12px; color: var(--dm); margin-bottom: 20px; word-break: break-all }
    .modal .btns { display: flex; gap: 8px; justify-content: flex-end }
    .modal .btns button {
      padding: 8px 20px; border: none; border-radius: 16px;
      font-size: 11px; font-weight: 700; letter-spacing: .4px;
      text-transform: uppercase; cursor: pointer; transition: all .2s;
    }
    .modal .mbtn-r { background: var(--er); color: #fff }
    .modal .mbtn-r:hover { filter: brightness(1.2) }
    .modal .mbtn-s { background: var(--bd); color: var(--tx) }
    .modal .mbtn-s:hover { background: var(--dm) }

    /* ── Hex/Text editor ─────────────────────────────── */
    .editor-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; background: var(--s1);
      border-bottom: 1px solid var(--bd); flex-shrink: 0;
    }
    .editor-bar .ebtn {
      background: none; border: 1px solid var(--bd); color: var(--dm);
      font-size: 11px; font-weight: 600; padding: 4px 14px;
      cursor: pointer; border-radius: 12px; transition: all .2s;
      letter-spacing: .4px; text-transform: uppercase;
    }
    .editor-bar .ebtn:hover { color: var(--tx); border-color: var(--tx) }
    .editor-bar .ebtn.eact { color: #fff; background: var(--ac); border-color: var(--ac) }
    .editor-bar .ename {
      font-size: 12px; color: var(--tx); font-weight: 600;
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .editor-bar .esz { font-size: 11px; color: var(--dm); margin-left: auto }

    .hex-wrap {
      flex: 1; overflow: auto; font-family: 'SF Mono', Consolas, monospace;
      font-size: 14px; line-height: 1.6; padding: 8px 0;
    }
    .hex-row {
      display: flex; padding: 0 16px; white-space: pre;
    }
    .hex-row:hover { background: rgba(255,255,255,.02) }
    .hex-off { color: var(--dm); width: 80px; flex-shrink: 0; user-select: none }
    .hex-bytes { flex-shrink: 0 }
    .hex-bytes span { cursor: pointer; padding: 0 1px; border-radius: 2px }
    .hex-bytes span:hover { background: rgba(0,112,255,.2) }
    .hex-bytes span.dirty { color: var(--ok); font-weight: 700 }
    .hex-sep { width: 12px; flex-shrink: 0 }
    .hex-ascii { color: var(--ac2); flex-shrink: 0; flex: 1 }
    .hex-ascii span { cursor: pointer; border-radius: 2px }
    .hex-ascii span:hover { background: rgba(0,187,255,.15) }
    .hex-ascii span.dirty { color: var(--ok); font-weight: 700 }

    .hex-edit-input {
      background: var(--ac); color: #fff; border: none;
      font-family: inherit; font-size: inherit; font-weight: 700;
      width: 20px; text-align: center; padding: 0; border-radius: 2px;
      outline: none;
    }

    .text-wrap {
      flex: 1; position: relative; overflow: hidden;
    }
    .text-wrap textarea, .text-wrap pre {
      position: absolute; inset: 0; width: 100%; height: 100%;
      margin: 0; padding: 12px 16px;
      font-family: 'SF Mono', Consolas, monospace; font-size: 13px;
      line-height: 1.6; tab-size: 4; white-space: pre-wrap; word-wrap: break-word;
      border: none; resize: none; outline: none;
      overflow: auto; -webkit-overflow-scrolling: touch;
    }
    .text-wrap textarea {
      background: transparent; color: transparent; caret-color: var(--tx);
      z-index: 2;
    }
    .text-wrap textarea.text-plain {
      background: var(--bg); color: var(--tx); z-index: 1;
    }
    .text-wrap pre {
      background: var(--bg); color: var(--tx);
      z-index: 1; pointer-events: none;
    }
    /* syntax colors */
    .hl-key { color: #7cb8ff }
    .hl-str { color: #a5d6ff }
    .hl-num { color: #79c0ff }
    .hl-bool { color: #ff7b72 }
    .hl-null { color: #ff7b72; font-style: italic }
    .hl-tag { color: #7ee787 }
    .hl-attr { color: #d2a8ff }
    .hl-aval { color: #a5d6ff }
    .hl-cmt { color: #505068; font-style: italic }

    /* ── Context menu ────────────────────────────────── */
    .ctx-menu {
      position: fixed; background: var(--s1); border: 1px solid var(--bd);
      border-radius: 8px; padding: 4px 0; min-width: 140px;
      box-shadow: 0 4px 16px rgba(0,0,0,.5); z-index: 200;
    }
    .ctx-menu div {
      padding: 7px 14px; font-size: 12px; cursor: pointer;
      transition: background .1s;
    }
    .ctx-menu div:hover { background: rgba(255,255,255,.05) }
    .ctx-menu .ctx-del { color: var(--er) }

    /* ── Options dropdown ────────────────────────────── */
    .opts-menu {
      display: none; position: absolute; top: 100%; right: 0;
      background: var(--s1); border: 1px solid var(--bd);
      border-radius: 8px; padding: 4px 0; min-width: 200px;
      box-shadow: 0 4px 16px rgba(0,0,0,.5); z-index: 200;
      margin-top: 4px;
    }
    .opts-menu.open { display: block }
    .mob-opts { display: none; position: relative }
    .opts-menu div {
      padding: 9px 16px; font-size: 12px; cursor: pointer;
      transition: background .1s; white-space: nowrap;
    }
    .opts-menu div:hover { background: rgba(255,255,255,.05) }

    /* ── Progress bar ────────────────────────────────── */
    .prog {
      width: 100%; height: 4px; background: var(--bd);
      border-radius: 2px; margin-top: 8px; overflow: hidden;
    }
    .prog-fill {
      height: 100%; background: var(--ac); border-radius: 2px;
      transition: width .15s; width: 0%;
    }
    .prog-text {
      font-size: 11px; color: var(--dm); margin-top: 6px;
      font-family: 'SF Mono', Consolas, monospace;
    }

    /* ── Hamburger button (mobile only) ─────────────── */
    .hamburger {
      display: none; background: none; border: 1px solid var(--bd);
      color: var(--tx); padding: 6px 8px; border-radius: 6px;
      cursor: pointer; font-size: 18px; line-height: 1;
    }

    /* ── Mobile menu overlay ────────────────────────── */
    .mob-menu {
      display: none; position: fixed; top: 48px; left: 0; right: 0;
      background: var(--s1); border-bottom: 1px solid var(--bd);
      z-index: 50; flex-direction: column; padding: 8px 0;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .mob-menu.open { display: flex }
    .mob-menu .tab {
      border-radius: 0; padding: 12px 20px; text-align: left;
      font-size: 13px; border: none;
    }
    .mob-menu .tab.active { border-radius: 0 }
    .mob-menu .shut {
      margin: 8px 16px; text-align: center;
    }

    /* ── Drawer toggle (mobile browse) ──────────────── */
    .drawer-toggle {
      display: none; padding: 10px 16px; background: var(--s1);
      border-bottom: 1px solid var(--bd); cursor: pointer;
      font-size: 11px; font-weight: 700; color: var(--dm);
      text-transform: uppercase; letter-spacing: 1px;
      flex-shrink: 0;
    }
    .drawer-toggle:hover { color: var(--tx) }

    /* ── Mobile ─────────────────────────────────────── */
    @media (max-width: 768px) {
      .hamburger { display: block }
      nav .tab, nav .shut { display: none }

      .main { flex-direction: column }
      .main .left {
        width: 100%; min-width: 0; border-right: none;
        border-bottom: 1px solid var(--bd);
        max-height: 50vh; flex-shrink: 0;
      }
      .main .left.collapsed .svs { display: none }
      .main .left.collapsed { max-height: none }
      .main.full .left { display: none }

      .drawer-toggle { display: block }
      .desk-shdr { display: none !important }

      .desk-btn { display: none !important }
      .mob-opts { display: inline-block !important }
      .tb { gap: 6px; padding: 8px 10px }
      .tb .btn { font-size: 10px; padding: 5px 10px }
      .tb img { width: 60px !important; height: 34px !important }

      .drop { padding: 24px 20px; max-width: 100%; width: 95% }

      .logw { height: 100px }

      .fi { font-size: 12px; padding: 6px 10px }
      .dir-dots { opacity: .5 }
    }

    /* ── User selector ────────────────────────────────── */
    .user-sel {
      position: relative; display: inline-flex; align-items: center;
      margin-right: 12px;
    }
    .user-btn {
      background: none; border: 1px solid var(--bd); color: var(--tx);
      font-size: 11px; font-weight: 600; padding: 4px 10px;
      cursor: pointer; border-radius: 12px; transition: all .2s;
      display: flex; align-items: center; gap: 4px;
    }
    .user-btn:hover { border-color: var(--ac); color: var(--ac) }
    .user-btn .arrow { font-size: 8px; color: var(--dm) }
    .user-dd {
      display: none; position: absolute; top: 100%; left: 0; margin-top: 4px;
      background: var(--s1); border: 1px solid var(--bd); border-radius: 8px;
      min-width: 140px; z-index: 100; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .user-dd.open { display: block }
    .user-dd div {
      padding: 8px 12px; font-size: 11px; cursor: pointer; transition: background .1s;
    }
    .user-dd div:hover { background: var(--gl) }
    .user-dd div.active { color: var(--ac); font-weight: 700 }

    /* ── Backup & Sync tab (LAN sync) ───────────────── */
    .ls-wrap { padding: 16px; display: flex; flex-direction: column; gap: 14px }
    .ls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
    .ls-card { background: var(--s1); border: 1px solid var(--bd); border-radius: 12px; padding: 14px; min-width: 0; overflow-x: auto }
    .ls-h { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: var(--ac2); margin-bottom: 10px }
    .ls-dim { color: var(--dm); font-size: 11px; font-weight: 400; text-transform: none; letter-spacing: 0 }
    .ls-kv td { padding: 3px 10px 3px 0; font-size: 12px; vertical-align: top }
    .ls-kv td:first-child { color: var(--dm); white-space: nowrap }
    .ls-acts { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap }
    .ls-w { font-size: 10px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--bd); color: var(--dm) }
    .ls-w.deep { color: #ffb020; border-color: #5a4210 }
    .ls-w.write { color: var(--er); border-color: #5a1020 }
    .ls-b { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px; white-space: nowrap }
    .ls-b.ok { background: rgba(0,221,119,.12); color: var(--ok) }
    .ls-b.warn { background: rgba(255,176,32,.12); color: #ffb020 }
    .ls-b.orng { background: rgba(255,120,40,.14); color: #ff8a3d }
    .ls-b.bad { background: rgba(255,34,68,.14); color: var(--er) }
    .ls-b.dim { background: rgba(80,80,104,.2); color: var(--dm) }
    .ls-mini { background: transparent; color: var(--tx); border: 1px solid var(--bd); border-radius: 10px;
               padding: 3px 9px; font-size: 10px; cursor: pointer; margin: 1px }
    .ls-mini:hover { border-color: var(--ac) }
    .ls-mini:disabled { opacity: .3; cursor: not-allowed }
    .ls-tbl { width: 100%; border-collapse: collapse; font-size: 12px }
    .ls-tbl th { text-align: left; color: var(--dm); font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
                 padding: 4px 6px; border-bottom: 1px solid var(--bd) }
    .ls-tbl td { padding: 6px; border-bottom: 1px solid rgba(26,26,53,.6); vertical-align: top }
    .ls-tbl tr.sel td, .ls-tbl tr.cur td { background: rgba(0,112,255,.06) }
    .ls-rowacts { white-space: normal; max-width: 330px }
    .ls-job { margin-top: 8px }
    .ls-bar { height: 6px; background: var(--bd); border-radius: 3px; margin: 6px 0; overflow: hidden }
    .ls-bar div { height: 100%; background: var(--ac) }
    .ls-cat { margin-top: 8px; font-size: 12px }
    .ls-catres { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--bd) }
    .ls-anom { cursor: pointer; padding: 3px 0 }
    .ls-anom:hover { color: var(--ac2) }
    .ls-ev { max-height: 340px; overflow-y: auto; font-size: 11px }
    .ls-evr { padding: 2px 0; border-bottom: 1px solid rgba(26,26,53,.5); word-break: break-word }
    .ls-evr.bad b { color: var(--er) }
    .ls-sets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px }
    .ls-set { font-size: 12px; display: flex; align-items: center; gap: 6px }
    .ls-set input[type=number] { width: 70px; background: var(--bg); border: 1px solid var(--bd); color: var(--tx);
                                 padding: 3px 6px; border-radius: 6px }
    .ls-set select { background: var(--bg); border: 1px solid var(--bd); color: var(--tx); padding: 3px 6px; border-radius: 6px }
    .ls-set input[type=checkbox] { accent-color: var(--ac); width: 15px; height: 15px }
    @media (max-width: 900px) { .ls-grid, .ls-sets { grid-template-columns: 1fr } }

    /* ══ Theme v2: calm surfaces, one accent, sentence case ══════════════ */
    :root {
      --bg: #0f1115; --s1: #15181e; --s2: #1c2028; --s3: #232833; --bd: #272c37;
      --ac: #4c8dff; --ac2: #8db4ff; --gl: transparent;
      --tx: #e3e6eb; --dm: #8a92a2; --ok: #3fb871; --wn: #e2a336; --er: #e5534b; --lb: #0b0d10;
    }
    body { background: var(--bg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px }
    nav { height: 52px; padding: 0 16px; gap: 2px }
    nav::after { display: none }
    .logo { background: none; -webkit-text-fill-color: currentColor; color: var(--tx); font-size: 15px; font-weight: 700;
            letter-spacing: 0; text-transform: none; margin-right: 16px }
    .tab { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; padding: 7px 11px;
           border-radius: 6px; border: 0; color: var(--dm) }
    .tab:hover { color: var(--tx); background: var(--s2) }
    .tab.active { color: var(--tx); background: var(--s3); box-shadow: none; border: 0 }
    .shut { text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 500; border-radius: 6px;
            border: 1px solid var(--bd); color: var(--dm); padding: 6px 11px }
    .shut:hover { background: rgba(229,83,75,.12); color: var(--er); border-color: rgba(229,83,75,.5) }
    .pcchip { border-radius: 6px; font-size: 12px; font-weight: 500; padding: 6px 11px }
    .pcdot.ok { background: var(--ok) } .pcdot.busy { background: var(--wn) } .pcdot.warn { background: var(--er) }
    .user-btn { border-radius: 6px }
    .btn, .bbtn, .dlnk { text-transform: none; letter-spacing: 0; border-radius: 6px; font-size: 13px; font-weight: 600;
                         padding: 7px 14px; box-shadow: none }
    .btn:hover, .bbtn:hover, .dlnk:hover { box-shadow: none; filter: brightness(1.08) }
    .btn.sec { background: var(--s2); color: var(--tx); border: 1px solid var(--bd) }
    .btn.sec:hover { background: var(--s3); filter: none }
    .btn.quiet { background: none; color: var(--dm); padding: 7px 10px }
    .btn.quiet:hover { color: var(--tx); background: var(--s2); filter: none }
    .btn.danger { background: none; color: var(--er); border: 1px solid rgba(229,83,75,.4) }
    .btn.danger:hover { background: rgba(229,83,75,.1); filter: none }
    .btn.sm { padding: 4px 10px; font-size: 12px }
    .btn.red { background: var(--er) } .btn.grn { background: var(--ok); color: #0b0d10 }
    .iconbtn { background: none; border: 0; color: var(--dm); width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
               font-size: 18px; line-height: 1; flex: none }
    .iconbtn:hover { background: var(--s3); color: var(--tx) }
    .shdr { text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600; color: var(--dm) }
    .ptab { text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600; padding: 3px 10px }
    .ptab:first-of-type { border-radius: 6px 0 0 6px } .ptab:last-of-type { border-radius: 0 6px 6px 0 }
    .sv { border-left: 0; padding: 9px 12px }
    .sv.sel { background: rgba(76,141,255,.12); box-shadow: none }
    .sv .tid { font-size: 13px; font-weight: 600; letter-spacing: 0 }
    .badge { border-radius: 4px; font-weight: 600 }
    .bulk-bar .bulk-all, .bulk-bar .bulk-btn { text-transform: none; letter-spacing: 0 }
    .bulk-bar .bulk-btn { border-radius: 6px; font-size: 11px; font-weight: 600 }
    .modal { border-radius: 10px; background: var(--s1) }
    .modal-bg { backdrop-filter: none; background: rgba(0,0,0,.55) }
    .modal .btns button { text-transform: none; letter-spacing: 0; border-radius: 6px; font-size: 13px; font-weight: 600 }
    .ctx-menu { background: var(--s2); border: 1px solid var(--bd); border-radius: 8px; padding: 4px; min-width: 210px;
                box-shadow: 0 10px 30px rgba(0,0,0,.45) }
    .ctx-menu div { padding: 8px 10px; font-size: 13px; border-radius: 5px }
    .ctx-menu div:hover { background: var(--s3) }
    .ctx-menu div.sep { height: 1px; padding: 0; margin: 4px 2px; background: var(--bd); pointer-events: none }
    .ctx-menu div.off { color: var(--dm); cursor: default; background: none }
    .ctx-menu div.hdr { color: var(--dm); font-size: 11px; cursor: default; background: none; padding: 6px 10px 2px }
    .logw .shdr { text-transform: none }
    /* Backup & Sync, calmer */
    .ls-card { border-radius: 10px; padding: 16px }
    .ls-h { font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--tx) }
    .ls-tbl th { text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600 }
    .ls-tbl td { border-bottom-color: var(--bd); padding: 8px 6px }
    .ls-tbl tr.sel td, .ls-tbl tr.cur td { background: rgba(76,141,255,.08) }
    .ls-tbl tr.click { cursor: pointer } .ls-tbl tr.click:hover td { background: var(--s2) }
    .ls-mini { border-radius: 6px; font-size: 12px; padding: 4px 10px; background: var(--s2); border-color: var(--bd) }
    .ls-mini:hover { background: var(--s3); border-color: var(--bd) }
    .ls-b { border-radius: 4px; font-weight: 600; font-size: 11px }
    .ls-b.ok { background: rgba(63,184,113,.14); color: #5fd08f }
    .ls-b.warn { background: rgba(226,163,54,.14); color: #f0bd5e }
    .ls-b.bad { background: rgba(229,83,75,.15); color: #f07a72 }
    .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--bd); border-radius: 7px; padding: 2px; gap: 2px; flex-wrap: wrap }
    .seg button { background: none; border: 0; color: var(--dm); font-size: 12px; font-weight: 500; padding: 5px 10px;
                  border-radius: 5px; cursor: pointer }
    .seg button:hover { color: var(--tx) }
    .seg button.on { background: var(--s3); color: var(--tx) }

    /* ══ Browse: game list + game page ══════════════════════════════════ */
    .tb:empty { display: none }
    .gthumb { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; flex: none; background: var(--s3);
              display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: var(--dm);
              font-size: 14px; margin-right: 10px }
    .sv .sv-row { align-items: center }
    .gp { padding: 20px 24px 40px; max-width: 980px; width: 100% }
    .gp-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap }
    .gp-cover { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--s3); flex: none;
                display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: var(--dm) }
    .gp-title { flex: 1; min-width: 200px }
    .gp-title h2 { font-size: 20px; font-weight: 700; color: var(--tx) }
    .gp-sub { color: var(--dm); margin-top: 4px; font-size: 13px }
    .gp-actions { display: flex; gap: 8px; align-items: center }
    .gp-note { background: var(--s1); border: 1px solid var(--bd); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px;
               display: flex; align-items: center; gap: 10px; font-size: 13px }
    .gp-note.warn { border-color: rgba(226,163,54,.45) } .gp-note.bad { border-color: rgba(229,83,75,.5) }
    .gp-note .grow { flex: 1 }
    .gp-panel:empty { display: none }
    .gp-panel { background: var(--s1); border: 1px solid var(--bd); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px }
    .gp-panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px }
    .gp-hint { color: var(--dm); font-size: 12px; margin-bottom: 10px; line-height: 1.5 }
    .gp-list { border: 1px solid var(--bd); border-radius: 10px; overflow: hidden; background: var(--s1) }
    .gp-row { display: flex; align-items: center; gap: 12px; padding: 11px 12px 11px 14px; cursor: pointer;
              border-top: 1px solid var(--bd) }
    .gp-row:first-child { border-top: 0 }
    .gp-row:hover { background: var(--s2) }
    .gp-row.open { background: var(--s2) }
    .gp-main { flex: 1; min-width: 0 }
    .gp-name { font-size: 14px; font-weight: 600; color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .gp-meta { color: var(--dm); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .gp-state { color: var(--dm); font-size: 12px; white-space: nowrap; text-align: right }
    .st { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dm) }
    .st.ok { background: var(--ok) } .st.wn { background: var(--wn) } .st.er { background: var(--er) } .st.in { background: var(--ac) }
    .gp-detail { background: var(--bg); border-top: 1px solid var(--bd); padding: 14px 16px 16px 34px }
    .gp-detail .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px }
    .gp-detail input[type=text] { flex: 1; min-width: 180px; max-width: 360px; background: var(--s1); border: 1px solid var(--bd);
                                  color: var(--tx); padding: 7px 10px; border-radius: 6px; font-size: 13px }
    .gp-detail input[type=text]:focus { outline: none; border-color: var(--ac) }
    .chip { background: var(--s2); border: 1px solid var(--bd); color: var(--dm); border-radius: 12px; padding: 3px 9px;
            font-size: 12px; cursor: pointer }
    .chip:hover { color: var(--tx); border-color: var(--dm) }
    .gp-sec { color: var(--dm); font-size: 12px; font-weight: 600; margin: 4px 0 6px }
    .gp-vers { border: 1px solid var(--bd); border-radius: 8px; overflow: hidden }
    .gp-ver { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 1px solid var(--bd); font-size: 13px }
    .gp-ver:first-child { border-top: 0 }
    .gp-ver .when { flex: 1; min-width: 0 }
    .gp-ver .when small { color: var(--dm); margin-left: 6px }
    .gp-ver .tag { color: var(--dm); font-size: 12px }
    .gp-files { color: var(--dm); font-size: 12px; margin-top: 10px; font-family: ui-monospace, Consolas, monospace }
    .gp-empty { color: var(--dm); padding: 24px; text-align: center }
    .gp-gone { margin-top: 18px }
    .gp-gone summary { cursor: pointer; color: var(--dm); font-size: 13px; margin-bottom: 8px }

    /* PS5 browser: bigger targets, menus as a bottom sheet, actions always visible */
    html.ps5 body { font-size: 16px }
    html.ps5 .tab { font-size: 15px; padding: 10px 14px }
    html.ps5 .btn { font-size: 15px; padding: 11px 18px }
    html.ps5 .iconbtn { width: 44px; height: 44px; font-size: 24px; background: var(--s2) }
    html.ps5 .sv { padding: 14px 14px }
    html.ps5 .gp-row { padding: 16px 14px 16px 18px }
    html.ps5 .gp-name { font-size: 17px } html.ps5 .gp-meta, html.ps5 .gp-state { font-size: 14px }
    html.ps5 .gp-ver { padding: 12px; font-size: 15px }
    .ctx-menu.sheet { left: 0 !important; right: 0; bottom: 0; top: auto !important; border-radius: 14px 14px 0 0;
                      padding: 10px 10px 18px; max-height: 70vh; overflow-y: auto }
    .ctx-menu.sheet div { padding: 16px 18px; font-size: 18px }
    .ctx-menu.sheet div.sep { padding: 0; margin: 6px 4px }
    .ctx-menu.sheet div.hdr { font-size: 14px; padding: 10px 18px 4px }
    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 199 }
  </style>
</head>
<body>

<!-- ── Navigation ──────────────────────────────────── -->
<nav>
  <span class="logo">Shallot</span>
  <div class="user-sel" id="usersel">
    <button class="user-btn" onclick="toggleUserDD()"><span id="curuser" data-i18n="common.loading">Loading...</span> <span class="arrow">&#9662;</span></button>
    <div class="user-dd" id="userdd"></div>
  </div>
  <button class="tab active" data-tab="browse" data-i18n="nav.browse" onclick="switchTab('browse')">Browse</button>
  <button class="tab" data-tab="sync" data-i18n="nav.sync" onclick="switchTab('sync')">Backup &amp; Sync</button>
  <button class="tab" data-tab="decrypt" data-i18n="nav.decrypt" onclick="switchTab('decrypt')">Decrypt</button>
  <button class="tab" data-tab="encrypt" data-i18n="nav.encrypt" onclick="switchTab('encrypt')">Encrypt</button>
  <button class="tab" data-tab="resign" data-i18n="nav.resign" onclick="switchTab('resign')">Resign</button>
  <button class="tab" data-tab="import" data-i18n="nav.import" onclick="switchTab('import')">Import</button>
  <button class="tab" data-tab="settings" data-i18n="nav.settings" onclick="switchTab('settings')">Settings</button>
  <span class="spacer"></span>

<script>
window.SHALLOT_I18N = {};
"__I18N_DICTIONARIES__";

const DEFAULT_LANG = 'en';
const LANGUAGE_OPTIONS = [
  { value: 'en', label: 'English' },
  { value: 'zh-CN', label: '简体中文' }
];
const SUPPORTED_LANGS = LANGUAGE_OPTIONS.map(option => option.value);
const savedLanguage = localStorage.getItem('shallot_lang');
let langPreference = savedLanguage && SUPPORTED_LANGS.includes(savedLanguage)
  ? savedLanguage : 'system';
if (savedLanguage && langPreference === 'system') localStorage.removeItem('shallot_lang');

function systemLanguage() {
  const browserLangs = navigator.languages && navigator.languages.length
    ? navigator.languages : [navigator.language || DEFAULT_LANG];
  for (const browserLang of browserLangs) {
    const normalized = String(browserLang).toLowerCase();
    if (normalized === 'zh' || normalized === 'zh-cn' || normalized.startsWith('zh-hans')) return 'zh-CN';
    if (normalized === 'en' || normalized.startsWith('en-')) return 'en';
  }
  return DEFAULT_LANG;
}

function resolveLanguage(preference) {
  if (preference === 'system') return systemLanguage();
  return SUPPORTED_LANGS.includes(preference) ? preference : DEFAULT_LANG;
}

let lang = resolveLanguage(langPreference);

function t(key, fallback, vars) {
  const dict = (window.SHALLOT_I18N && window.SHALLOT_I18N[lang]) || {};
  let text = dict[key] || fallback || key;
  if (vars) Object.keys(vars).forEach(name => {
    text = text.split('{' + name + '}').join(String(vars[name]));
  });
  return text;
}

function applyLanguage() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    if (!el.dataset.i18nEn) el.dataset.i18nEn = el.textContent;
    el.textContent = t(el.dataset.i18n, el.dataset.i18nEn);
  });
}

function setLanguage(value) {
  langPreference = value === 'system' ? 'system'
    : (SUPPORTED_LANGS.includes(value) ? value : 'system');
  if (langPreference === 'system') localStorage.removeItem('shallot_lang');
  else localStorage.setItem('shallot_lang', langPreference);
  lang = resolveLanguage(langPreference);
  applyLanguage();
  renderL();
  renderTB();
  renderCt();
}

function languageOptionLabel(value) {
  if (value === 'system') return t('settings.language_system', 'System / Browser Default');
  const option = LANGUAGE_OPTIONS.find(item => item.value === value);
  return option ? option.label : value;
}

function languageOptionsHtml() {
  const system = '<option value="system"' + (langPreference === 'system' ? ' selected' : '')
    + '>' + languageOptionLabel('system') + '</option>';
  return system + LANGUAGE_OPTIONS.map(option =>
    '<option value="' + esc(option.value) + '"' + (langPreference === option.value ? ' selected' : '')
    + '>' + esc(option.label) + '</option>'
  ).join('');
}

/* ── State ─────────────────────────────────────────── */
let S = [], si = -1, tab = 'browse';
let mt = false, bsy = false;
let cf = [], ex = new Set();
let aid = '', stitle = '', mtid = '', mpt = '';
let cloudPoll = null, cloudAwaiting = false, cloudBusy = false, lastCloudProgress = '';
let bulkSel = new Set(), bulkRunning = false;

/* ── Utilities ─────────────────────────────────────── */
function $(id) { return document.getElementById(id) }

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function log(m, c) {
  const d = $('log'), t = new Date().toLocaleTimeString();
  d.innerHTML += '<div class="ll' + (c ? ' ' + c : '') + '">'
    + '<span class="t">' + t + '</span>' + esc(m) + '</div>';
  d.scrollTop = d.scrollHeight;
}

function fmtB(b) {
  if (b < 1024) return b + 'B';
  if (b < 1048576) return (b / 1024).toFixed(1) + 'K';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + 'M';
  if (b < 1099511627776) return (b / 1073741824).toFixed(1) + 'G';
  return (b / 1099511627776).toFixed(1) + 'T';
}

/* ── XHR upload with progress ──────────────────────── */
function upload(url, file, onProgress, respType) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    if (respType) xhr.responseType = respType;
    xhr.timeout = 300000; /* 5 min timeout for large saves */
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded, e.total);
    };
    xhr.onload = () => resolve(xhr);
    xhr.onerror = () => reject(new Error('Network error'));
    xhr.ontimeout = () => reject(new Error('Timeout'));
    xhr.send(file);
  });
}

function showProgress(pct, loaded, total) {
  let el = document.getElementById('upprog');
  if (!el) {
    const ct = $('ct');
    const drop = ct.querySelector('.drop');
    if (!drop) return;
    el = document.createElement('div');
    el.id = 'upprog';
    el.innerHTML = '<div class="prog"><div class="prog-fill"></div></div><div class="prog-text"></div>';
    drop.appendChild(el);
  }
  el.querySelector('.prog-fill').style.width = pct + '%';
  el.querySelector('.prog-text').textContent = fmtB(loaded) + ' / ' + fmtB(total) + ' (' + pct + '%)';
}

/* ── Drag & drop zone setup ────────────────────────── */
/* A drop tile: a click anywhere (or Enter / Space) does what its button does. */
function dzTile(el) {
  const b = el.querySelector('.bbtn');
  if (!b || !el.classList.contains('tile')) return;
  el.onclick = e => { if (!e.target.closest('button')) b.click(); };
  el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.click(); } };
}

/* Page head of a tool tab: title and what it does. */
function toolHead(key, title) {
  return '<div class="tool"><div class="tool-h">' + esc(title) + helpTip('tool_' + key) + '</div>'
    + '<div class="tool-sub">' + esc(helpText('tool_' + key)) + '</div>';
}

function setupDZ(id, fn) {
  const el = $(id);
  if (!el) return;
  setTimeout(() => dzTile(el), 0);
  el.ondragover = e => { e.preventDefault(); el.classList.add('over') };
  el.ondragleave = e => { e.preventDefault(); el.classList.remove('over') };
  el.ondrop = e => {
    e.preventDefault(); el.classList.remove('over');
    if (e.dataTransfer.files.length) fn(e.dataTransfer.files);
  };
  const b = el.querySelector('.bbtn');
  if (b) b.onclick = e => {
    e.stopPropagation();
    const i = document.createElement('input');
    i.type = 'file'; i.multiple = true;
    i.onchange = () => { if (i.files.length) fn(i.files) };
    i.click();
  };
}

/* ── Folder drag & drop zone setup ────────────────── */
function setupFolderDZ(id, fn) {
  const el = $(id);
  if (!el) return;
  setTimeout(() => dzTile(el), 0);
  el.ondragover = e => { e.preventDefault(); el.classList.add('over') };
  el.ondragleave = e => { e.preventDefault(); el.classList.remove('over') };
  el.ondrop = async e => {
    e.preventDefault(); el.classList.remove('over');
    const items = e.dataTransfer.items;
    if (!items || !items.length) return;
    const files = [];
    const entries = [];
    for (let i = 0; i < items.length; i++) {
      const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
      if (entry) entries.push(entry);
    }
    if (entries.length && entries[0].isDirectory) {
      const all = await readEntryRecursive(entries[0], '');
      if (all.length) fn(all, entries[0].name);
    } else if (e.dataTransfer.files.length) {
      fn(Array.from(e.dataTransfer.files));
    }
  };
  const b = el.querySelector('.bbtn');
  if (b) b.onclick = e => {
    e.stopPropagation();
    const i = document.createElement('input');
    i.type = 'file'; i.webkitdirectory = true;
    i.onchange = () => {
      if (i.files.length) {
        const prefix = i.files[0].webkitRelativePath.split('/')[0];
        fn(Array.from(i.files), prefix);
      }
    };
    i.click();
  };
}

/* ── Recursively read folder entries ──────────────── */
function readEntryRecursive(entry, basePath) {
  return new Promise(resolve => {
    if (entry.isFile) {
      entry.file(f => {
        f._path = basePath + f.name;
        resolve([f]);
      });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const all = [];
      const readBatch = () => {
        reader.readEntries(entries => {
          if (!entries.length) {
            Promise.all(all).then(arrs => resolve(arrs.flat()));
            return;
          }
          for (const e of entries) {
            all.push(readEntryRecursive(e, basePath + entry.name + '/'));
          }
          readBatch();
        });
      };
      readBatch();
    } else {
      resolve([]);
    }
  });
}

/* ── Options dropdown toggle ───────────────────────── */
function toggleOpts() {
  const m = $('optsmenu');
  if (!m) return;
  m.classList.toggle('open');
}
function closeOpts() {
  const m = $('optsmenu');
  if (m) m.classList.remove('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.opts-menu') && !e.target.closest('[onclick*="toggleOpts"]'))
    closeOpts();
});

/* ── Hamburger menu ────────────────────────────────── */
function toggleMenu() {
  const m = $('mobmenu');
  m.classList.toggle('open');
}

/* ── Drawer toggle (mobile save list) ─────────────── */
let drawerOpen = false;
function toggleDrawer() {
  drawerOpen = !drawerOpen;
  updateDrawer();
}
function updateDrawer() {
  const d = $('drawer');
  const cnt = S.filter(s => s.type === platform).length;
  if (drawerOpen) {
    d.classList.remove('collapsed');
    $('dtog').innerHTML = '\u25BE ' + t('layout.saves', 'Saves')
      + ' <button class="ptab' + (platform === 'ps5' ? ' active' : '') + '" onclick="event.stopPropagation();setPlatform(\'ps5\')" style="margin-left:8px">PS5</button>'
      + '<button class="ptab' + (platform === 'ps4' ? ' active' : '') + '" onclick="event.stopPropagation();setPlatform(\'ps4\')">PS4</button>';
  } else {
    d.classList.add('collapsed');
    $('dtog').textContent = '\u25B8 ' + platform.toUpperCase() + ' ' + t('layout.saves', 'Saves') + (cnt ? ' (' + cnt + ')' : '');
  }
}

/* ── User selector ─────────────────────────────────── */
let users = [];
let curUid = '';

async function loadUsers() {
  try {
    const r = await fetch('/api/users');
    const d = await r.json();
    users = d.users || [];
    if (users.length > 0) {
      curUid = users[0].id;
      $('curuser').removeAttribute('data-i18n');
      $('curuser').textContent = users[0].name;
    }
    if (users.length <= 1) $('usersel').querySelector('.arrow').style.display = 'none';
  } catch(e) {}
}

function toggleUserDD() {
  if (users.length <= 1) return;
  const dd = $('userdd');
  dd.classList.toggle('open');
  dd.innerHTML = users.map(u =>
    '<div class="' + (u.id === curUid ? 'active' : '') + '" onclick="selectUser(\'' + u.id + '\')">' + esc(u.name) + '</div>'
  ).join('');
}

function selectUser(uid) {
  curUid = uid;
  const u = users.find(x => x.id === uid);
  $('curuser').removeAttribute('data-i18n');
  $('curuser').textContent = u ? u.name : uid;
  $('userdd').classList.remove('open');
  si = -1; mt = null; cf = [];
  renderL(); renderTB(); renderCt(); updateDrawer();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.user-sel')) $('userdd').classList.remove('open');
});

/* ── Tab switching ─────────────────────────────────── */
function switchTab(t) {
  tab = t;
  document.querySelectorAll('nav .tab, .mob-menu .tab').forEach(b => {
    b.className = 'tab' + (b.dataset.tab === t ? ' active' : '');
  });
  $('mn').className = t === 'browse' ? 'main' : 'main full';
  /* Close mobile menu */
  $('mobmenu').classList.remove('open');
  if (t === 'browse') load();
  renderTB();
  renderCt();
  navSave();
}

/* ── Load saves list ───────────────────────────────── */
async function load() {
  try {
    const r = await fetch('/api/saves');
    const d = await r.json();
    S = d.saves || [];
    bulkSel.clear();
    renderL();
    renderTB();
    updateDrawer();
    log(t('status.loaded_saves', 'Loaded {count} saves', {count: S.length}), 'ok');
  } catch (e) {
    log(t('status.failed', 'Failed: {error}', {error: e.message}), 'err');
    S = [];
    renderL();
  }
}

/* ── Render save list (left panel) ─────────────────── */
let exG = new Set(); /* expanded groups */
let usbDrawerOpen = false;
let platform = 'ps5';

function setPlatform(p) {
  platform = p;
  $('ptab5').className = 'ptab' + (p === 'ps5' ? ' active' : '');
  $('ptab4').className = 'ptab' + (p === 'ps4' ? ' active' : '');
  si = -1; mt = null; cf = [];
  bulkSel.clear();
  renderL(); renderTB(); renderCt(); updateDrawer();
}

function bulkTitleCheckbox(titleId, anyUsb) {
  if (anyUsb) return '<span style="width:22px;flex-shrink:0"></span>';
  const on = bulkSel.has(titleId) ? ' checked' : '';
  const tid = esc(titleId).replace(/'/g, "\\'");
  return '<input type="checkbox" class="bulk-cb" onclick="event.stopPropagation();toggleBulkTitle(\'' + tid + '\')"' + on + '>';
}

function visibleBulkTitles() {
  const ptype = platform === 'ps4' ? 'ps4' : 'ps5';
  const ids = new Set();
  S.forEach(s => {
    if (s.type === ptype && !s.usb && s.uid === curUid) ids.add(s.title_id);
  });
  return [...ids].sort();
}

function toggleBulkTitle(titleId) {
  if (bulkSel.has(titleId)) bulkSel.delete(titleId);
  else bulkSel.add(titleId);
  updateBulkBar();
  renderL();
}

function onBulkSelectAll(checked) {
  const vis = visibleBulkTitles();
  if (checked) vis.forEach(t => bulkSel.add(t));
  else vis.forEach(t => bulkSel.delete(t));
  updateBulkBar();
  renderL();
}

function updateBulkBar() {
  const vis = visibleBulkTitles();
  const n = vis.filter(t => bulkSel.has(t)).length;
  const cnt = $('bulkCount');
  if (cnt) cnt.textContent = t('bulk.titles', '{count} titles', {count: n});
  const all = $('bulkSelectAll');
  if (all) {
    all.checked = vis.length > 0 && n === vis.length;
    all.indeterminate = n > 0 && n < vis.length;
  }
  const dis = bsy || bulkRunning || n === 0;
  ['bulkDec', 'bulkEnc', 'bulkCloud'].forEach(id => {
    const b = $(id);
    if (b) b.disabled = dis;
  });
}

function gThumb(tid, name) {
  const letter = esc(((name || tid || '?').trim()[0] || '?').toUpperCase());
  return '<img class="gthumb" alt="" src="/api/backup/game_icon?title=' + encodeURIComponent(tid) + '" '
    + 'onerror="this.outerHTML=\'<span class=&quot;gthumb&quot;>' + letter + '</span>\'">';
}

function renderGroup(g, h) {
  const anyUsbG = g.items.every(i => S[i].usb);
  if (!anyUsbG) {                      /* a game: one row, opens the game page */
    const n = g.items.filter(i => !/^sdimg_sce_bu_/.test(S[i].save_name || '')).length || g.items.length;
    const on = gpTid === g.title_id && gpView !== 'files';
    h += '<div class="sv' + (on || g.items.includes(si) ? ' sel' : '') + '" data-t="' + esc(g.title_id) + '" onclick="openGame(this.dataset.t)"'
      + ' oncontextmenu="openGame(this.dataset.t);gpGameMenu(event)">';
    h += '<div class="sv-row">' + bulkTitleCheckbox(g.title_id, false) + gThumb(g.title_id, g.name);
    h += '<div class="sv-body"><div class="tid" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(g.name) + '</div>';
    h += '<div class="sn">' + esc(t('saves.count', '{count} saves', {count: n})) + '</div></div></div></div>';
    return h;
  }
  const gtype = S[g.items[0]].type || 'ps5';
  const badge = '<span class="badge badge-' + gtype + '">' + gtype.toUpperCase() + '</span>';
  const anyUsb = g.items.every(i => S[i].usb);
  const gkey = (anyUsb ? 'usb:' : '') + g.title_id;
  const tdots = '<span class="title-dots" onclick="event.stopPropagation();showTitleMenu(event,\'' + esc(g.title_id).replace(/'/g, "\\'") + '\',' + anyUsb + ')">\u22EE</span>';
  function saveDots(idx) {
    return '<span class="title-dots" onclick="event.stopPropagation();showSaveMenu(event,' + idx + ')">\u22EE</span>';
  }
  if (g.items.length === 1) {
    const i = g.items[0], s = S[i];
    const bu = s.backup ? '<span class="badge badge-bu">' + t('badge.backup', 'BACKUP') + '</span>' : '';
    h += '<div class="sv' + (i === si ? ' sel' : '') + '" onclick="sel(' + i + ')">';
    h += '<div class="sv-row">' + bulkTitleCheckbox(g.title_id, anyUsb);
    h += '<div class="sv-body"><div class="tid">' + bu + badge + esc(g.name) + tdots + '</div>';
    h += '<div class="sn">' + esc(s.save_name) + '</div></div></div></div>';
  } else {
    const open = exG.has(gkey);
    const anySel = g.items.includes(si);
    const gesc = esc(gkey).replace(/'/g, "\\'");
    h += '<div class="sv' + (anySel ? ' sel' : '') + '" onclick="togG(\'' + gesc + '\',event)" style="cursor:pointer">';
    h += '<div class="sv-row">' + bulkTitleCheckbox(g.title_id, anyUsb);
    h += '<div class="sv-body"><div class="tid">' + badge + (open ? '\u25BE ' : '\u25B8 ') + esc(g.name) + tdots + '</div>';
    h += '<div class="sn">' + esc(t('saves.count', '{count} saves', {count: g.items.length})) + '</div></div></div></div>';
    if (open) {
      g.items.forEach(i => {
        const s = S[i];
        const bu = s.backup ? '<span class="badge badge-bu">' + t('badge.backup', 'BACKUP') + '</span>' : '';
        const dots = saveDots(i);
        h += '<div class="sv' + (i === si ? ' sel' : '') + '" onclick="sel(' + i + ')" style="padding-left:16px">';
        h += '<div class="sv-row"><span style="width:22px;flex-shrink:0"></span>';
        h += '<div class="sv-body"><div class="sn" style="color:var(--tx)">' + bu + esc(s.save_name) + dots + '</div></div></div></div>';
      });
    }
  }
  return h;
}

function renderL() {
  const ptype = platform === 'ps4' ? 'ps4' : 'ps5';
  const filtered = S.map((s, i) => ({s, i})).filter(x => x.s.type === ptype && (x.s.usb || x.s.uid === curUid));
  if (!filtered.length) {
    $('svs').innerHTML = '<div class="empty">' + esc(t('saves.none', 'No {platform} saves found', {platform: ptype.toUpperCase()})) + '</div>';
    return;
  }
  /* Group saves by title_id, split system vs USB */
  const sysGroups = [], usbGroups = [];
  const sysMap = {}, usbMap = {};
  filtered.forEach(({s, i}) => {
    if (s.usb) {
      if (!usbMap[s.title_id]) {
        usbMap[s.title_id] = { title_id: s.title_id, name: s.title_name || s.title_id, items: [] };
        usbGroups.push(usbMap[s.title_id]);
      }
      usbMap[s.title_id].items.push(i);
    } else {
      if (!sysMap[s.title_id]) {
        sysMap[s.title_id] = { title_id: s.title_id, name: s.title_name || s.title_id, items: [] };
        sysGroups.push(sysMap[s.title_id]);
      }
      sysMap[s.title_id].items.push(i);
    }
  });

  let h = '';
  sysGroups.forEach(g => { h = renderGroup(g, h); });

  if (usbGroups.length > 0) {
    h += '<div class="sv" onclick="event.stopPropagation();usbDrawerOpen=!usbDrawerOpen;renderL()" style="cursor:pointer;border-top:1px solid var(--bd);margin-top:4px">';
    h += '<div class="tid" style="color:#8b5cf6;font-weight:700">'
      + (usbDrawerOpen ? '\u25BE' : '\u25B8') + ' USB ' + esc(t('layout.saves', 'Saves'))
      + '<span class="badge badge-usb" style="float:none;margin-left:8px">' + usbGroups.length + '</span></div></div>';
    if (usbDrawerOpen) {
      usbGroups.forEach(g => { h = renderGroup(g, h); });
    }
  }

  $('svs').innerHTML = h;
  updateBulkBar();
}

async function autostartUpload() {
  const f = $('autoElf') && $('autoElf').files[0];
  if (!f) { autostartRender(t('auto.choose2', 'Choose the ELF file for Shallot first.'), true); return; }
  try {
    const r = await fetch('/api/system/autostart?action=upload', { method: 'POST', body: f });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    log(t('auto.saved', 'Shallot stored on the PS5'), 'ok');
    autostartRender(t('auto.saved', 'Shallot stored on the PS5'), false);
  } catch (e) { autostartRender(String(e.message || e), true); }
}
async function autostartSet(a) {
  let d;
  try { d = await lsPost('/api/system/autostart?action=' + a); } catch (e) { d = { error: String(e) }; }
  if (d.error) { autostartRender(d.error, true); return; }
  autostartRender(a === 'on' ? t('auto.enabled', 'onionHEN will start Shallot after the next boot.') : t('auto.disabled', 'Auto-start turned off.'), false);
}

function updateSettingsVisibility() {
  const p = $('setProvider') ? $('setProvider').value : 'ftp';
  const m = $('setDriveMode') ? $('setDriveMode').value : 'browser';
  const a = $('setDriveAuth') ? $('setDriveAuth').value : 'service_account';
  if ($('ftpSettings')) $('ftpSettings').style.display = p === 'ftp' ? 'block' : 'none';
  if ($('driveSettings')) $('driveSettings').style.display = p === 'google_drive' ? 'block' : 'none';
  if ($('driveOAuthRefreshSettings')) $('driveOAuthRefreshSettings').style.display = (p === 'google_drive' && a === 'oauth_refresh') ? 'block' : 'none';
  if ($('driveSaSettings')) $('driveSaSettings').style.display = (p === 'google_drive' && a === 'service_account') ? 'block' : 'none';
  if ($('directNote')) $('directNote').style.display = (p === 'google_drive' && m === 'direct') ? 'block' : 'none';
